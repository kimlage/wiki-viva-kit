schema_version: wiki_page_types.v1
page_types:
  action:
    template: docs/references/templates/wiki/action.md
    allowed_dirs:
      - memories/actions
    required_frontmatter:
      - page_id
      - page_type
      - context
      - visibility
      - updated_at
      - stale_after_days
      - source_refs
      - moc_parent
      - action_state
      - owner_kind
      - created_at
      - priority
      - attention_basis
    field_types:
      <<: &relation_field_types
        updated_at: date
        stale_after_days: string
        source_refs: list
        collection_refs: list
        collection: object
        moc_parent: string
        subject_ref: string
        subject_role: string
        parent_projection: object
        projection_overrides: object
        evidence_refs: list
        claims: list
        decisions: list
        actions: list
      action_state: enum:open,in_progress,blocked,waiting_human,done,cancelled
      action_state_history: list
      owner_kind: enum:human,agent,system,other,unassigned
      owner_ref: string
      created_at: date
      due_at: date
      completed_at: date_or_instant
      blocked_by: list
      blocker_reason: string
      next_action: string
      priority: string
      attention_basis: string
      completion_receipt: string
      cancellation_receipt: string
  claim:
    template: docs/references/templates/wiki/claim.md
    allowed_dirs:
      - memories/claims
    required_frontmatter: &relation_required
      - page_id
      - page_type
      - context
      - visibility
      - updated_at
      - stale_after_days
      - source_refs
      - moc_parent
    field_types:
      <<: *relation_field_types
      perspectives_required: list
      perspectives_optional: list
  context_note:
    # Free-form BODY, but creatable by hand: the template carries only the
    # provenance frontmatter every note needs (it sits first in the root's
    # create catalog — an uninstantiable catalog entry would be a lie).
    template: docs/references/templates/wiki/context-note.md
    allowed_dirs:
      - memories
    required_frontmatter:
      - page_id
      - page_type
      - context
      - visibility
      - updated_at
      - stale_after_days
    field_types:
      updated_at: date
      stale_after_days: string
      parent_projection: object
      projection_overrides: object
  context_hub:
    template: docs/references/templates/wiki/context-hub.md
    allowed_dirs:
      - memories
    required_frontmatter:
      - page_id
      - page_type
      - context
      - visibility
      - updated_at
      - stale_after_days
    field_types:
      updated_at: date
      stale_after_days: string
      collection: object
  dashboard:
    template: docs/references/templates/wiki/operation.md
    allowed_dirs:
      - memories
    required_frontmatter: &common_required
      - page_id
      - page_type
      - context
      - visibility
      - updated_at
      - stale_after_days
    field_types: &common_field_types
      updated_at: date
      stale_after_days: string
      collection_refs: list
      collection: object
  artifact:
    template: docs/references/templates/wiki/artifact.md
    allowed_dirs:
      - memories/artifacts
    required_frontmatter: *relation_required
    field_types:
      <<: *relation_field_types
      artifact_type: string
  decision:
    template: docs/references/templates/wiki/decision.md
    allowed_dirs:
      - memories/decisions
    required_frontmatter: *relation_required
    field_types: *relation_field_types
  holon:
    template: docs/references/templates/wiki/holon.md
    allowed_dirs:
      - memories/holons
      - memories
    required_frontmatter: *relation_required
    field_types: *relation_field_types
  ingestion_event:
    template: docs/references/templates/wiki/ingestion-event.md
    allowed_dirs:
      - memories/system/ingestion/events
    required_frontmatter:
      - page_id
      - page_type
      - context
      - visibility
      - updated_at
      - stale_after_days
      - event_id
      - source_id
      - moc_parent
    field_types:
      <<: *common_field_types
      event_id: string
      source_id: string
      source_ref: string
      source_refs: list
      moc_parent: string
      consolidated_into: list
    required_sections:
      - Source
      - Quadrants
  journal_entry:
    template: docs/references/templates/wiki/journal.md
    allowed_dirs:
      - memories
    required_frontmatter: *common_required
    field_types: *common_field_types
  ontology_index:
    template: none
    template_none_reason: "Ontology hubs are generated or hand-maintained indexes, not content instances."
    allowed_dirs:
      - memories
    required_frontmatter: *common_required
    field_types:
      <<: *common_field_types
      moc_parent: string
      parent_projection: object
      collection: object
  operational_rule:
    template: docs/references/templates/wiki/gate.md
    allowed_dirs:
      - memories
    required_frontmatter: *common_required
    field_types: *common_field_types
  input_channel:
    template: docs/references/templates/wiki/input-channel.md
    allowed_dirs:
      - memories/input-channels
      - memories/system/input-channels
    required_frontmatter:
      - page_id
      - page_type
      - context
      - visibility
      - updated_at
      - stale_after_days
      - channel_type
      - input_status
      - moc_parent
    field_types:
      <<: *relation_field_types
      channel_type: string
      input_status: enum:declared,configured,staged,blocked,ready_for_ingest,ingesting,integrated,no_ingest
      process_refs: list
      source_config_refs: list
      target_pages: list
      perspectives_required: list
      perspectives_optional: list
      quadrants: list
  meeting:
    template: docs/references/templates/wiki/meeting.md
    allowed_dirs:
      - memories/meetings
    required_frontmatter: *relation_required
    field_types:
      <<: *relation_field_types
      participants: list
  person:
    template: docs/references/templates/wiki/person.md
    allowed_dirs:
      - memories/people
    required_frontmatter: *relation_required
    field_types:
      <<: *relation_field_types
      aliases: list
  project:
    template: docs/references/templates/wiki/project.md
    allowed_dirs:
      - memories/projects
    required_frontmatter: *relation_required
    field_types: *relation_field_types
  process:
    template: docs/references/templates/wiki/process.md
    allowed_dirs:
      - memories/processes
      - memories/system/processes
    required_frontmatter: *relation_required
    field_types:
      <<: *relation_field_types
      cadence: string
      input_channels: list
  perspective:
    template: docs/references/templates/wiki/perspective.md
    allowed_dirs:
      - memories/system/perspectives
    required_frontmatter:
      - page_id
      - page_type
      - context
      - visibility
      - updated_at
      - stale_after_days
      - applies_to_source_types
      - extracts
      - target_page_types
      - prompt_profile
    field_types:
      updated_at: date
      applies_to_source_types: list
      extracts: list
      target_page_types: list
    required_sections:
      - Concern
      - Extraction Questions
      - Target Pages
      - Correspondence Rules
  relationship_map:
    template: docs/references/templates/wiki/relationship-map.md
    allowed_dirs:
      - memories
    required_frontmatter: *common_required
    field_types: *common_field_types
  responsibility:
    template: docs/references/templates/wiki/responsibility.md
    allowed_dirs:
      - memories/responsibilities
    required_frontmatter: *relation_required
    field_types: *relation_field_types
  role:
    template: docs/references/templates/wiki/role.md
    allowed_dirs:
      - memories/roles
    required_frontmatter: *relation_required
    field_types: *relation_field_types
  root_entity:
    template: docs/references/templates/wiki/root-entity.md
    allowed_dirs:
      - memories
      - memories/root
    # moc_parent is OPTIONAL for the root: the root entity is the top of the
    # world — everything descends from it (the anchor-scope model), it
    # descends from nothing.
    required_frontmatter:
      - page_id
      - page_type
      - context
      - visibility
      - updated_at
      - stale_after_days
      - root_entity_type
      - primary_contexts
      - input_stage_ref
    field_types:
      <<: *relation_field_types
      root_entity_type: enum:person,team,company,project,community,product
      primary_contexts: list
      input_stage_ref: string
      input_channels: list
      perspective_bundle_required: list
      perspective_bundle_optional: list
    required_sections:
      - Identity and Scope
      - Integral Quadrant Map
      - Channels and Input Sources
      - Perspective Bundle
      - Source Ingestion Map
  source:
    template: docs/references/templates/wiki/source.md
    allowed_dirs:
      - memories/sources
    required_frontmatter:
      - page_id
      - page_type
      - context
      - visibility
      - updated_at
      - stale_after_days
      - source_type
      - moc_parent
    field_types:
      <<: *relation_field_types
      source_type: string
      source_lifecycle: object
      source_lifecycle_state: string
      source_freshness_state: string
      source_last_attempt_state: string
      source_pipeline_stage: string
      source_adoption_state: string
      source_blocked_reason: string
  source_catalog:
    template: none
    template_none_reason: "Catalog pages are navigation or generated registries with local structure."
    allowed_dirs:
      - memories
    required_frontmatter: *common_required
    field_types: *common_field_types
  source_config:
    template: docs/references/templates/wiki/source-config.md
    allowed_dirs:
      - memories/sources/config
    required_frontmatter: *relation_required
    field_types: *relation_field_types
    required_sections:
      - Ingestion rules
      - Search rules
      - Business rules
      - Privacy boundaries
  source_registry:
    template: none
    template_none_reason: "The source registry is generated from source frontmatter."
    allowed_dirs:
      - memories/system
    required_frontmatter:
      - page_id
      - page_type
      - context
      - visibility
      - updated_at
      - stale_after_days
      - parent_projection
    field_types:
      <<: *common_field_types
      parent_projection: object
      collection: object
  input_stage:
    template: none
    template_none_reason: "The input stage is generated from the root entity, input channels, sources and source configs."
    allowed_dirs:
      - memories/system
    required_frontmatter: *common_required
    field_types: *common_field_types
  system_log:
    template: none
    template_none_reason: "Append-only logs have local ledger structure rather than reusable content templates."
    allowed_dirs:
      - memories/system
    required_frontmatter: *common_required
    field_types: *common_field_types
  # --- v2: blocks, skills and tools as pages ---------------------------------
  # The nested `block:` / `inputs:` payloads are validated STRUCTURALLY by
  # wiki_core.template_blocks (which reads them with the typed parser); the shape
  # gate here only checks the flat scalar frontmatter every page carries.
  template_block:
    template: docs/references/templates/wiki/template-block.md
    allowed_dirs:
      - memories/system/blocks
    required_frontmatter: *common_required
    field_types: *common_field_types
    required_sections:
      - Purpose
      - Contract
  skill:
    template: docs/references/templates/wiki/skill.md
    allowed_dirs:
      - memories/system/skills
    required_frontmatter:
      - page_id
      - page_type
      - context
      - visibility
      - updated_at
      - stale_after_days
      - skill_type
    field_types:
      updated_at: date
      stale_after_days: string
      skill_type: enum:human,agent
    required_sections:
      - Purpose
      - Contract
      - Playbook
  tool:
    template: docs/references/templates/wiki/tool.md
    allowed_dirs:
      - memories/tools
    required_frontmatter:
      - page_id
      - page_type
      - context
      - visibility
      - updated_at
      - stale_after_days
      - platform
      - moc_parent
    field_types:
      <<: *relation_field_types
      platform: string
