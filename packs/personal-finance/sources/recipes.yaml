schema_version: wiki_experience_pack_source_recipes.v1
pack: personal-finance
recipes:
  local-ledger-csv:
    source_kind: delimited-text
    public_fixture_only: true
    required_columns: [occurred_at, description, amount, direction]
    optional_columns: [category, balance, reference]
    credential_mode: none
    write_policy: derived-proposal-only
  local-statement-json:
    source_kind: structured-json
    public_fixture_only: true
    required_fields: [account_ref, period, transactions]
    credential_mode: none
    write_policy: derived-proposal-only
