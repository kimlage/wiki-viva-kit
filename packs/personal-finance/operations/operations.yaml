schema_version: wiki_experience_pack_operations.v1
pack: personal-finance
write_policy: proposal_branch_only
permissions:
  personal-finance.read-financial-sources:
    scope: repository-local-source-files
    mode: read_only
  personal-finance.propose-financial-changes:
    scope: pack-owned-page-types
    mode: proposal_only
  personal-finance.review-public-boundary:
    scope: public-export
    mode: human_approval_required
skills:
  human:
    - id: personal-finance.approve-monthly-close
      permissions: [personal-finance.review-public-boundary]
      responsibility: Verify reconciliation evidence and approve the closing proposal.
  agent:
    - id: personal-finance.classify-synthetic-transactions
      permissions: [personal-finance.read-financial-sources, personal-finance.propose-financial-changes]
      responsibility: Propose classifications with evidence and leave ambiguity visible.
operations:
  personal-finance.import-transactions:
    slot: operation.import
    command: personal-finance.import
    inputs: [source_ref, account_ref, import_period]
    outputs: [personal_finance_transaction]
    permissions: [personal-finance.read-financial-sources, personal-finance.propose-financial-changes]
    dry_run: true
    human_gate: required
    policies:
      duplicate_policy: block_and_review
  personal-finance.classify-transaction:
    slot: operation.classify
    command: personal-finance.classify
    inputs: [transaction_ref, category_ref, evidence_refs]
    outputs: [personal_finance_transaction]
    permissions: [personal-finance.read-financial-sources, personal-finance.propose-financial-changes]
    dry_run: true
    human_gate: required
    policies:
      ambiguity_policy: leave_unclassified
  personal-finance.reconcile-account:
    slot: operation.reconcile
    command: personal-finance.reconcile
    inputs: [account_ref, period, source_balance]
    outputs: [personal_finance_reconciliation]
    permissions: [personal-finance.read-financial-sources, personal-finance.propose-financial-changes]
    dry_run: true
    human_gate: required
    policies:
      mismatch_policy: block_close
  personal-finance.monthly-close:
    slot: operation.monthly-close
    command: personal-finance.monthly-close
    inputs: [period, source_refs, reconciliation_refs]
    outputs: [personal_finance_monthly_closing]
    permissions: [personal-finance.read-financial-sources, personal-finance.propose-financial-changes, personal-finance.review-public-boundary]
    dry_run: true
    human_gate: required
    policies:
      incomplete_policy: block_close
  personal-finance.forecast-cashflow:
    slot: operation.forecast
    command: personal-finance.forecast
    inputs: [account_refs, obligation_refs, horizon]
    outputs: [personal_finance_obligation]
    permissions: [personal-finance.read-financial-sources, personal-finance.propose-financial-changes]
    dry_run: true
    human_gate: required
    policies:
      uncertainty_policy: preserve_range
