  personal_finance_category:
    title: Category
    visibility: private
    template: templates/category.md
    fields: [category_kind, parent_category_ref, budget_policy]
  personal_finance_reconciliation:
    title: Reconciliation
    visibility: private
    template: templates/reconciliation.md
    fields: [account_ref, period, source_balance, ledger_balance, difference, reconciliation_state]
  personal_finance_monthly_closing:
    title: Monthly closing
    visibility: private
    template: templates/monthly-closing.md
    fields: [period, source_refs, reconciliation_refs, close_state, closed_at, review_ref]
