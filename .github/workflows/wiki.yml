name: wiki

on:
  pull_request:
  push:
    branches: [main]

jobs:
  audit-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.x"
      - name: Install poppler (pdftotext)
        run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - name: Install deps
        run: pip install -r requirements.txt
      - name: Tests
        run: python -m pytest tests/ -q
      - name: OKF interop smoke
        run: |
          python scripts/wiki_okf_export.py --out tmp/okf-ci --clean
          python scripts/wiki_okf_check.py --bundle tmp/okf-ci --check
          python scripts/wiki_okf_visualize.py --bundle tmp/okf-ci --out tmp/okf-ci/viz.html
          python scripts/wiki_okf_import.py --bundle tmp/okf-ci --context system --dry-run
      - name: Wiki audit (secrets, PII on public pages, links, quadrants, promotion gate)
        run: python scripts/wiki_audit.py --check
      - name: Wiki quality ratchet
        run: python scripts/wiki_quality_report.py --check
      - name: Methodology coverage (presence + content)
        run: python scripts/wiki_check_methodology_coverage.py --check
      - name: Operation cockpit freshness (decisions/actions)
        run: python scripts/wiki_operation_compile.py --check
      - name: Operational pass freshness (sources/actions/contexts)
        run: python scripts/wiki_operational_pass.py --check
      - name: Source registry freshness (state + last update)
        run: python scripts/wiki_source_registry.py --check
      - name: Input stage freshness (root entity + channels)
        run: python scripts/wiki_input_stage.py --check
      - name: Deterministic v8 demo artifacts
        run: python scripts/wiki_build_demo.py --check
      - name: Atomic v8 snapshot contract
        run: python scripts/wiki_web_snapshot.py --check-contract
      - name: Consolidation closed (ingesting = integrating)
        run: python scripts/wiki_consolidate.py --check

  cockpit-v8:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/wiki-cockpit/package-lock.json
      - name: Install cockpit dependencies
        working-directory: apps/wiki-cockpit
        run: npm ci
      - name: Frontend unit tests
        working-directory: apps/wiki-cockpit
        run: npm test
      - name: Gate implementation tests
        working-directory: apps/wiki-cockpit
        run: npm run test:gates
      - name: Frontend architecture boundaries
        working-directory: apps/wiki-cockpit
        run: npm run check:architecture
      - name: Production build
        working-directory: apps/wiki-cockpit
        run: npm run build
      - name: Bundle budgets and lazy boundaries
        working-directory: apps/wiki-cockpit
        run: npm run check:bundle

  cockpit-visual:
    needs: cockpit-v8
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/wiki-cockpit/package-lock.json
      - name: Install cockpit dependencies
        working-directory: apps/wiki-cockpit
        run: npm ci
      - name: Install browser engines
        working-directory: apps/wiki-cockpit
        run: npx playwright install --with-deps chromium webkit firefox
      - name: Desktop, mobile, fallback and cross-browser gates
        working-directory: apps/wiki-cockpit
        run: npm run test:visual
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cockpit-visual-${{ runner.os }}-attempt-${{ github.run_attempt }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            apps/wiki-cockpit/test-results
            apps/wiki-cockpit/e2e/__screenshots__/linux
            output/playwright/wiki-cockpit-report
