name: wiki

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  audit-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.x"
      - uses: actions/setup-node@v5
        with:
          node-version: "22.22.3"
          cache: npm
          cache-dependency-path: apps/wiki-cockpit/package-lock.json
      - name: Install poppler (pdftotext)
        run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - name: Install deps
        run: |
          python3 -m pip install -r requirements.txt
          npm install --global npm@10.9.8
          test "$(node --version)" = "v22.22.3"
          test "$(npm --version)" = "10.9.8"
      - name: Capture exact job-local Node workspace authority
        run: |
          set -euo pipefail
          SOURCE_SHA="$(git rev-parse HEAD)"
          AUTHORITY="$RUNNER_TEMP/wiki-viva-audit-node-authority.json"
          test ! -e "$AUTHORITY"
          CAPTURE_JSON="$(
            python3 scripts/wiki_node_workspace.py capture-authority \
              --out "$AUTHORITY" \
              --source-sha "$SOURCE_SHA"
          )"
          AUTHORITY_SHA256="$(
            printf '%s\n' "$CAPTURE_JSON" \
              | python3 -c 'import json, sys; print(json.load(sys.stdin)["authority_sha256"])'
          )"
          test "${#AUTHORITY_SHA256}" -eq 64
          {
            echo "WIKI_VIVA_NODE_WORKSPACE_AUTHORITY=$AUTHORITY"
            echo "WIKI_VIVA_NODE_WORKSPACE_AUTHORITY_SHA256=$AUTHORITY_SHA256"
            echo "WIKI_VIVA_NODE_WORKSPACE_SOURCE_SHA=$SOURCE_SHA"
          } >> "$GITHUB_ENV"
      - name: Tests
        run: python3 -m pytest -q -W error tests/
      - name: Exact-base page graph and impact evidence
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          test -n "$BASE_SHA"
          python3 scripts/wiki_page_graph.py --check --impact --base "$BASE_SHA" > /tmp/wiki-page-graph-impact.json
          python3 -m json.tool /tmp/wiki-page-graph-impact.json
      - name: OKF interop smoke
        run: |
          python3 scripts/wiki_okf_export.py --out tmp/okf-ci --clean
          python3 scripts/wiki_okf_check.py --bundle tmp/okf-ci --check
          python3 scripts/wiki_okf_visualize.py --bundle tmp/okf-ci --out tmp/okf-ci/viz.html
          python3 scripts/wiki_okf_import.py --bundle tmp/okf-ci --context system --dry-run
      - name: Wiki audit (secrets, PII on public pages, links, quadrants, promotion gate)
        run: python3 scripts/wiki_audit.py --check
      - name: Public-export privacy boundary
        run: python3 scripts/wiki_audit.py --public-export --check
      - name: Experience-pack registry, assets and composition
        run: python3 scripts/wiki_pack.py validate --all
      - name: Wiki quality ratchet
        run: python3 scripts/wiki_quality_report.py --check
      - name: Methodology coverage (presence + content)
        run: python3 scripts/wiki_check_methodology_coverage.py --check
      - name: Operation cockpit freshness (decisions/actions)
        run: python3 scripts/wiki_operation_compile.py --check
      - name: Operational pass freshness (sources/actions/contexts)
        run: python3 scripts/wiki_operational_pass.py --check
      - name: Source registry freshness (state + last update)
        run: python3 scripts/wiki_source_registry.py --check
      - name: Input stage freshness (root entity + channels)
        run: python3 scripts/wiki_input_stage.py --check
      - name: Authored event and relation parity
        run: python3 scripts/wiki_semantic_inventory.py --check
      - name: Deterministic v8 demo artifacts
        run: python3 scripts/wiki_build_demo.py --check
      - name: Atomic v8 snapshot contract
        run: python3 scripts/wiki_web_snapshot.py --check-contract
      - name: Consolidation closed (ingesting = integrating)
        run: python3 scripts/wiki_consolidate.py --check

  cockpit-v8:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v5
        with:
          node-version: "22.22.3"
          cache: npm
          cache-dependency-path: apps/wiki-cockpit/package-lock.json
      - name: Pin exact npm and capture job-local Node workspace authority
        run: |
          set -euo pipefail
          npm install --global npm@10.9.8
          test "$(node --version)" = "v22.22.3"
          test "$(npm --version)" = "10.9.8"
          SOURCE_SHA="$(git rev-parse HEAD)"
          AUTHORITY="$RUNNER_TEMP/wiki-viva-cockpit-node-authority.json"
          test ! -e "$AUTHORITY"
          CAPTURE_JSON="$(
            python3 scripts/wiki_node_workspace.py capture-authority \
              --out "$AUTHORITY" \
              --source-sha "$SOURCE_SHA"
          )"
          AUTHORITY_SHA256="$(
            printf '%s\n' "$CAPTURE_JSON" \
              | python3 -c 'import json, sys; print(json.load(sys.stdin)["authority_sha256"])'
          )"
          test "${#AUTHORITY_SHA256}" -eq 64
          {
            echo "WIKI_VIVA_NODE_WORKSPACE_AUTHORITY=$AUTHORITY"
            echo "WIKI_VIVA_NODE_WORKSPACE_AUTHORITY_SHA256=$AUTHORITY_SHA256"
            echo "WIKI_VIVA_NODE_WORKSPACE_SOURCE_SHA=$SOURCE_SHA"
          } >> "$GITHUB_ENV"
      - name: Frontend unit tests
        run: python3 scripts/wiki_node_workspace.py run test
      - name: Gate implementation tests
        run: python3 scripts/wiki_node_workspace.py run test:gates
      - name: Exact public and downstream release-cell contract
        run: python3 scripts/wiki_node_workspace.py run check:release-matrix
      - name: Frontend architecture boundaries
        run: python3 scripts/wiki_node_workspace.py run check:architecture
      - name: Asset licenses, integrity and budgets
        run: python3 scripts/wiki_node_workspace.py run check:assets
      - name: Production build
        run: python3 scripts/wiki_node_workspace.py run build
      - name: Bundle budgets and lazy boundaries
        run: python3 scripts/wiki_node_workspace.py run check:bundle

  snapshot-flat-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.x"
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Flat snapshot remains supported; mutable evidence boundaries fail closed
        run: >-
          python -m pytest -q
          tests/test_web_snapshot.py::test_atomic_legacy_migration_fails_closed_on_unsupported_platform
          tests/test_web_snapshot.py::test_live_revision_publication_fails_closed_without_posix_leases
          tests/test_web_snapshot.py::test_flat_reader_rejects_valid_but_unowned_directory
          tests/test_web_snapshot_cli.py::test_web_snapshot_cli_rejects_absolute_output_outside_repo
          tests/test_release_receipt.py::test_release_evidence_operations_fail_closed_on_windows_boundary
          tests/test_action_transition.py::test_action_writes_fail_closed_on_windows_boundary

  cockpit_visual_runner_policy:
    runs-on: ubuntu-latest
    env:
      EVENT_NAME: ${{ github.event_name }}
      HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
      REF: ${{ github.ref }}
      REPOSITORY: ${{ github.repository }}
      STRICT_VISUAL_RUNNER: ${{ vars.WIKI_VIVA_STRICT_VISUAL_RUNNER }}
    steps:
      - name: Require one explicitly provisioned trusted visual runner
        run: |
          if [[ -z "$STRICT_VISUAL_RUNNER" ]]; then
            echo "WIKI_VIVA_STRICT_VISUAL_RUNNER must name an attested GPU-backed runner label."
            exit 1
          fi
          case "$STRICT_VISUAL_RUNNER" in
            wiki-viva-strict-visual-*) ;;
            *)
              echo "The strict runner must use a unique wiki-viva-strict-visual-* label."
              exit 1
              ;;
          esac
          case "$EVENT_NAME" in
            pull_request)
              if [[ "$HEAD_REPOSITORY" != "$REPOSITORY" ]]; then
                echo "Strict visual certification never dispatches fork code to the configured runner."
                exit 1
              fi
              ;;
            push)
              if [[ "$REF" != "refs/heads/main" ]]; then
                echo "Strict visual certification accepts push events only from main."
                exit 1
              fi
              ;;
            *)
              echo "Strict visual certification received an unsupported event."
              exit 1
              ;;
          esac

  cockpit-visual:
    needs: [audit-and-test, cockpit-v8, cockpit_visual_runner_policy]
    if: ${{ needs.audit-and-test.result == 'success' && needs.cockpit_visual_runner_policy.result == 'success' }}
    # The exact release matrix contains fail-closed hardware WebGL and frame
    # budgets. Standard hosted pools are not assumed capable. This job accepts
    # only a custom label on an isolated ARM64 macOS self-hosted runner. A
    # separately reviewed adapter is required for an eligible hosted larger
    # runner. Runtime attestation still rejects software rendering.
    runs-on:
      - self-hosted
      - macOS
      - ARM64
      - "${{ vars.WIKI_VIVA_STRICT_VISUAL_RUNNER }}"
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v5
        with:
          node-version: "22.22.3"
          cache: npm
          cache-dependency-path: apps/wiki-cockpit/package-lock.json
      - name: Pin exact npm and capture job-local Node workspace authority
        run: |
          set -euo pipefail
          npm install --global npm@10.9.8
          test "$(node --version)" = "v22.22.3"
          test "$(npm --version)" = "10.9.8"
          SOURCE_SHA="$(git rev-parse HEAD)"
          AUTHORITY="$RUNNER_TEMP/wiki-viva-visual-node-authority.json"
          test ! -e "$AUTHORITY"
          CAPTURE_JSON="$(
            python3 scripts/wiki_node_workspace.py capture-authority \
              --out "$AUTHORITY" \
              --source-sha "$SOURCE_SHA"
          )"
          AUTHORITY_SHA256="$(
            printf '%s\n' "$CAPTURE_JSON" \
              | python3 -c 'import json, sys; print(json.load(sys.stdin)["authority_sha256"])'
          )"
          test "${#AUTHORITY_SHA256}" -eq 64
          {
            echo "WIKI_VIVA_NODE_WORKSPACE_AUTHORITY=$AUTHORITY"
            echo "WIKI_VIVA_NODE_WORKSPACE_AUTHORITY_SHA256=$AUTHORITY_SHA256"
            echo "WIKI_VIVA_NODE_WORKSPACE_SOURCE_SHA=$SOURCE_SHA"
          } >> "$GITHUB_ENV"
      - name: Install browser engines
        run: |
          python3 -m pip install playwright==1.61.1
          python3 -m playwright install chromium webkit firefox
      - name: Desktop, mobile, fallback and cross-browser gates
        # This command fixes retries at zero, rejects any skip/flaky/retry in
        # the required public scope and refuses to collect downstream specs.
        run: python3 scripts/wiki_node_workspace.py run test:e2e:release
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cockpit-visual-${{ runner.os }}-attempt-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 14
          path: |
            apps/wiki-cockpit/test-results
            apps/wiki-cockpit/e2e/__screenshots__/linux
            output/playwright/wiki-cockpit-report
