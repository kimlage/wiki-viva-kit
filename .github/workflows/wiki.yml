name: wiki

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  audit-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.x"
      - uses: actions/setup-node@v5
        with:
          node-version: "22.22.3"
          cache: npm
          cache-dependency-path: apps/wiki-cockpit/package-lock.json
      - name: Install poppler (pdftotext)
        run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - name: Install deps
        run: |
          python3 -m pip install -r requirements.txt
          npm install --global npm@10.9.8
          test "$(node --version)" = "v22.22.3"
          test "$(npm --version)" = "10.9.8"
      - name: Tests
        run: python3 -m pytest -q -W error tests/
      - name: Exact-base page graph and impact evidence
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          test -n "$BASE_SHA"
          python3 scripts/wiki_page_graph.py --check --impact --base "$BASE_SHA" > /tmp/wiki-page-graph-impact.json
          python3 -m json.tool /tmp/wiki-page-graph-impact.json
      - name: OKF interop smoke
        run: |
          python3 scripts/wiki_okf_export.py --out tmp/okf-ci --clean
          python3 scripts/wiki_okf_check.py --bundle tmp/okf-ci --check
          python3 scripts/wiki_okf_visualize.py --bundle tmp/okf-ci --out tmp/okf-ci/viz.html
          python3 scripts/wiki_okf_import.py --bundle tmp/okf-ci --context system --dry-run
      - name: Wiki audit (secrets, PII on public pages, links, quadrants, promotion gate)
        run: python3 scripts/wiki_audit.py --check
      - name: Public-export privacy boundary
        run: python3 scripts/wiki_audit.py --public-export --check
      - name: Experience-pack registry, assets and composition
        run: python3 scripts/wiki_pack.py validate --all
      - name: Wiki quality ratchet
        run: python3 scripts/wiki_quality_report.py --check
      - name: Methodology coverage (presence + content)
        run: python3 scripts/wiki_check_methodology_coverage.py --check
      - name: Operation cockpit freshness (decisions/actions)
        run: python3 scripts/wiki_operation_compile.py --check
      - name: Operational pass freshness (sources/actions/contexts)
        run: python3 scripts/wiki_operational_pass.py --check
      - name: Source registry freshness (state + last update)
        run: python3 scripts/wiki_source_registry.py --check
      - name: Input stage freshness (root entity + channels)
        run: python3 scripts/wiki_input_stage.py --check
      - name: Authored event and relation parity
        run: python3 scripts/wiki_semantic_inventory.py --check
      - name: Deterministic v8 demo artifacts
        run: python3 scripts/wiki_build_demo.py --check
      - name: Atomic v8 snapshot contract
        run: python3 scripts/wiki_web_snapshot.py --check-contract
      - name: Consolidation closed (ingesting = integrating)
        run: python3 scripts/wiki_consolidate.py --check

  cockpit-v8:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v5
        with:
          node-version: "22.22.3"
          cache: npm
          cache-dependency-path: apps/wiki-cockpit/package-lock.json
      - name: Install frontend dependencies
        run: |
          npm install --global npm@10.9.8
          test "$(node --version)" = "v22.22.3"
          test "$(npm --version)" = "10.9.8"
          npm --prefix apps/wiki-cockpit ci
      - name: Frontend unit tests
        run: npm --prefix apps/wiki-cockpit test
      - name: Architecture, assets and gate contracts
        run: |
          npm --prefix apps/wiki-cockpit run check:architecture
          npm --prefix apps/wiki-cockpit run check:assets
          npm --prefix apps/wiki-cockpit run test:gates
      - name: TypeScript
        run: npm --prefix apps/wiki-cockpit exec -- tsc -p apps/wiki-cockpit/tsconfig.json --noEmit
      - name: Production build
        run: npm --prefix apps/wiki-cockpit run build

  cockpit-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22.22.3"
          cache: npm
          cache-dependency-path: apps/wiki-cockpit/package-lock.json
      - name: Install browser dependencies
        working-directory: apps/wiki-cockpit
        run: |
          npm install --global npm@10.9.8
          npm ci
          npx playwright install --with-deps chromium firefox webkit
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install native operator dependencies
        run: python3 -m pip install -r requirements.txt
      # Hardware frame-time evidence remains a separate local GPU run. These
      # are all functional projects, not a claim that software rendering is GPU.
      - name: Browser journeys (desktop, keyboard, mobile, fallback, Firefox)
        working-directory: apps/wiki-cockpit
        run: >-
          npm run test:e2e:release --
          --project=chromium-desktop --project=webkit-keyboard
          --project=webkit-mobile --project=chromium-fallback
          --project=firefox-smoke
      - name: Temporary public demo diagnostics
        if: failure()
        run: |
          python3 - <<'PYDIAG'
          import base64
          from pathlib import Path
          root = Path("apps/wiki-cockpit/test-results/playwright-dev-artifacts")
          for folder in root.iterdir():
              if not any(name in folder.name for name in ("keyboard-genesis-native", "visual-regression-review")):
                  continue
              for path in folder.iterdir():
                  if path.name == "error-context.md" or path.suffix == ".json":
                      print("DIAGNOSTIC", str(path), path.read_text()[:16000])
                  elif path.name == "review-demo-actual.png":
                      print("REVIEW_IMAGE_BASE64", base64.b64encode(path.read_bytes()).decode())
          PYDIAG
      - name: Verify built UI against the native operator
        if: ${{ !cancelled() }}
        env:
          WIKI_COCKPIT_REAL_BASE_URL: http://127.0.0.1:18765
        run: |
          # Startup codes are intentionally discarded, never uploaded as logs.
          python3 scripts/wiki_web_server.py --port 18765 --frontend apps/wiki-cockpit/dist >/dev/null 2>&1 &
          operator_pid=$!
          trap 'kill "$operator_pid"' EXIT
          python3 - <<'PY'
          import json, os, subprocess, time, urllib.request
          from pathlib import Path
          from wiki_core.web.snapshot import build_snapshot
          from wiki_core.web.schemas import WEB_SERVER_VERSION, SCHEMA_CAPABILITIES
          base = os.environ["WIKI_COCKPIT_REAL_BASE_URL"]
          url = base + "/api/snapshot/manifest.json"
          for attempt in range(30):
              try:
                  with urllib.request.urlopen(url, timeout=30) as response:
                      served = json.load(response)
                  break
              except (OSError, TimeoutError):
                  if attempt == 29:
                      raise
                  time.sleep(1)
          expected = build_snapshot(Path.cwd())
          manifest = expected["manifest.json"]
          versions = manifest["versions"]
          packs = expected["experience_packs.json"]
          env = {
              "SNAPSHOT_URL": base + "/api/snapshot/pages.json",
              "EXPECT_REPO_ID": manifest["repo"]["repo_id"],
              "EXPECT_CONSUMER_HEAD": subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip(),
              "EXPECT_SNAPSHOT_REVISION": served["snapshot_id"],
              "EXPECT_SNAPSHOT_HASH": served["bundle_hash"],
              "EXPECT_SNAPSHOT_VERSION": versions["snapshot"],
              "EXPECT_RUNTIME_VERSION": versions["runtime_contract"],
              "EXPECT_SERVER_VERSION": WEB_SERVER_VERSION,
              "EXPECT_TEMPORAL_GRAPH_VERSION": versions["temporal_graph"],
              "EXPECT_TEMPORAL_EVENT_VERSION": versions["temporal_event"],
              "EXPECT_EXPERIENCE_PACK_COMPOSITION_VERSION": versions["experience_pack_composition"],
              "EXPECT_COMPOSITION_SHA256": packs["composition_sha256"],
              "EXPECT_ACTIVE_PACKS": json.dumps(packs["packs"]),
              "EXPECT_CAPABILITIES": ",".join(SCHEMA_CAPABILITIES),
              "MIN_PAGES": str(len(expected["pages.json"]["pages"])),
          }
          assert int(env["MIN_PAGES"]) > 0
          subprocess.run(
              ["npm", "--prefix", "apps/wiki-cockpit", "run", "test:e2e:operator"],
              env={**os.environ, **{"WIKI_COCKPIT_" + key: value for key, value in env.items()}},
              check=True,
          )
          PY
      - name: Browser failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cockpit-browser-failures
          path: |
            apps/wiki-cockpit/test-results/
            output/playwright/wiki-cockpit-report/
            output/playwright/wiki-cockpit-downstream-report/
          retention-days: 7

  snapshot-flat-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.x"
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Flat snapshot remains supported
        run: >-
          python -m pytest -q
          tests/test_web_snapshot.py::test_atomic_legacy_migration_fails_closed_on_unsupported_platform
          tests/test_web_snapshot.py::test_live_revision_publication_fails_closed_without_posix_leases
          tests/test_web_snapshot.py::test_flat_reader_rejects_valid_but_unowned_directory
          tests/test_web_snapshot_cli.py::test_web_snapshot_cli_rejects_absolute_output_outside_repo
          tests/test_action_transition.py::test_action_writes_fail_closed_on_windows_boundary
