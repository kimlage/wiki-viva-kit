        env:
          TRUSTED_CANARY_COMPLETION_ANCHOR_SHA256: ${{ steps.served_canary.outputs.canary_completion_anchor_sha256 }}
        run: |
          python - <<'PY'
          import hashlib, json, os, re
          from pathlib import Path
          from wiki_core.upgrade_lanes import canonical_sha256
          root = Path('.wiki-viva-ci/handoff')
          manifest = json.loads((root / 'handoff.json').read_text(encoding='utf-8'))
          run = root / 'consumer/.wiki-viva/upgrade/runs' / manifest['run_key']
          state_path = run / 'state.json'
          state = json.loads(state_path.read_text())
          assert state['status'] == 'paused_before_background'
          assert state['plan_sha256'] == manifest['execution_plan_sha256']
          assert state['capsule_sha256'] == manifest['capsule_sha256']
          assert state['impact_registry_sha256'] == manifest['impact_registry_sha256']
          assert state['gate_results']['real_canary']['status'] == 'passed'
          budget = state['acceptance_budget']
          assert budget['status'] in {'met', 'exceeded'}
          assert budget['limit_seconds'] == 1200
          assert isinstance(budget['plan_started_at'], str)
          assert isinstance(budget['canary_completed_at'], str)
          assert isinstance(budget['elapsed_milliseconds'], int)
          assert budget['elapsed_milliseconds'] >= 0
          trusted_completion = os.environ['TRUSTED_CANARY_COMPLETION_ANCHOR_SHA256']
          assert re.fullmatch(r'[0-9a-f]{64}', trusted_completion)
          completion_path = run / 'canary-completion-anchor.json'
          assert hashlib.sha256(completion_path.read_bytes()).hexdigest() == trusted_completion
          completion = json.loads(completion_path.read_text(encoding='utf-8'))
          assert completion['plan_sha256'] == manifest['execution_plan_sha256']
          assert completion['canary_completed_at'] == budget['canary_completed_at']
          manifest['canary_completion_anchor_sha256'] = trusted_completion
          manifest['acceptance_budget'] = budget
          manifest['acceptance_budget_sha256'] = canonical_sha256(budget)
          assert all(
              result['class'] != 'background_certification'
              for result in state['gate_results'].values()
          )
          assert not (run / 'adoption-receipt.json').exists()
          manifest['state_sha256'] = hashlib.sha256(state_path.read_bytes()).hexdigest()
          (root / 'handoff.json').write_text(
              json.dumps(manifest, indent=2, sort_keys=True) + '\n',
              encoding='utf-8',
          )
          PY
          tar -C .wiki-viva-ci -czf .wiki-viva-ci/canary-handoff.tgz handoff
      - name: Export out-of-band post-canary handoff anchor
        id: canary_handoff_anchor
        env:
          TRUSTED_ACCEPTANCE_ANCHOR_SHA256: ${{ needs['fast-adoption'].outputs.acceptance_anchor_sha256 }}
          TRUSTED_CANARY_COMPLETION_ANCHOR_SHA256: ${{ steps.served_canary.outputs.canary_completion_anchor_sha256 }}
        run: |
          HANDOFF_ARCHIVE_SHA256="$(python -c 'import hashlib; from pathlib import Path; print(hashlib.sha256(Path(".wiki-viva-ci/canary-handoff.tgz").read_bytes()).hexdigest())')"
          test "${#HANDOFF_ARCHIVE_SHA256}" -eq 64
          case "$HANDOFF_ARCHIVE_SHA256" in
            *[!0-9a-f]*) exit 1 ;;
          esac
          echo "handoff_archive_sha256=$HANDOFF_ARCHIVE_SHA256" >> "$GITHUB_OUTPUT"
          test "${#TRUSTED_ACCEPTANCE_ANCHOR_SHA256}" -eq 64
          case "$TRUSTED_ACCEPTANCE_ANCHOR_SHA256" in
            *[!0-9a-f]*) exit 1 ;;
          esac
          echo "acceptance_anchor_sha256=$TRUSTED_ACCEPTANCE_ANCHOR_SHA256" >> "$GITHUB_OUTPUT"
          test "${#TRUSTED_CANARY_COMPLETION_ANCHOR_SHA256}" -eq 64
          case "$TRUSTED_CANARY_COMPLETION_ANCHOR_SHA256" in
            *[!0-9a-f]*) exit 1 ;;
          esac
          echo "canary_completion_anchor_sha256=$TRUSTED_CANARY_COMPLETION_ANCHOR_SHA256" >> "$GITHUB_OUTPUT"
      - name: Upload exact post-canary consumer handoff and runner evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: wiki-upgrade-canary-handoff-${{ runner.os }}-${{ github.run_id }}
          overwrite: true
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14
          path: .wiki-viva-ci/canary-handoff.tgz

