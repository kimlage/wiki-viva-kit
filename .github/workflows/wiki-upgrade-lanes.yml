          receipt = json.loads((run / 'adoption-receipt.json').read_text())
          private = json.loads((run / 'migration-report.private.json').read_text())
          assert state['status'] == 'complete'
          assert state['plan_sha256'] == manifest['execution_plan_sha256']
          assert state['capsule_sha256'] == manifest['capsule_sha256']
          assert state['impact_registry_sha256'] == manifest['impact_registry_sha256']
          assert state['gate_results']['real_canary']['status'] == 'passed'
          background = [
              result for result in state['gate_results'].values()
              if result['class'] == 'background_certification'
          ]
          assert background and all(result['status'] == 'passed' for result in background)
          assert json.loads((run / 'rollback.json').read_text())['tree_equal'] is True
          public = json.loads((run / 'migration-report.public.json').read_text())
          budget = state['acceptance_budget']
          assert budget == manifest['acceptance_budget']
          assert canonical_sha256(budget) == manifest['acceptance_budget_sha256']
          assert budget == receipt['acceptance_budget'] == private['acceptance_budget']
          assert budget['status'] == 'met'
          assert budget['elapsed_milliseconds'] <= budget['limit_seconds'] * 1000
          assert public['acceptance_budget'] == {
              'schema_version': 'wiki_viva_upgrade_acceptance_budget_public.v1',
              'scope': budget['scope'],
              'limit_seconds': budget['limit_seconds'],
              'enforcement': budget['enforcement'],
              'status': budget['status'],
          }
          assert receipt['status'] == 'passed'
          assert public['public_redacted'] is True
          assert public['promotion_ready'] is True
          PY
      - name: Upload final same-consumer background evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: wiki-upgrade-background-${{ runner.os }}-${{ github.run_id }}
          overwrite: true
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14
          path: .wiki-viva-ci/handoff/consumer/.wiki-viva/upgrade
