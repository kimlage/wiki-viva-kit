      - name: Restore and verify exact paused state
        env:
          EXPECTED_HANDOFF_ARCHIVE_SHA256: ${{ needs['fast-adoption'].outputs.handoff_archive_sha256 }}
          EXPECTED_ACCEPTANCE_ANCHOR_SHA256: ${{ needs['fast-adoption'].outputs.acceptance_anchor_sha256 }}
        run: |
          python - <<'PY'
          import hashlib, hmac, os, re
          from pathlib import Path
          archive = Path('.wiki-viva-ci/incoming/fast-adoption-handoff.tgz')
          expected = os.environ['EXPECTED_HANDOFF_ARCHIVE_SHA256']
          if re.fullmatch(r'[0-9a-f]{64}', expected) is None:
              raise SystemExit('missing or invalid out-of-band fast-adoption handoff SHA-256')
          actual = hashlib.sha256(archive.read_bytes()).hexdigest()
          if not hmac.compare_digest(actual, expected):
              raise SystemExit('fast-adoption handoff archive does not match its out-of-band SHA-256')
          PY
          tar -C .wiki-viva-ci -xzf "$GITHUB_WORKSPACE/.wiki-viva-ci/incoming/fast-adoption-handoff.tgz"
          python - <<'PY'
          import hashlib, json, os, re
          from pathlib import Path
          import yaml
          from wiki_core.upgrade_lanes import canonical_sha256, verify_impact_registry
          root = Path('.wiki-viva-ci/handoff')
          manifest = json.loads((root / 'handoff.json').read_text(encoding='utf-8'))
          state = root / 'consumer/.wiki-viva/upgrade/runs' / manifest['run_key'] / 'state.json'
          assert manifest['schema_version'] == 'wiki_viva_upgrade_ci_handoff.v3'
          assert manifest['ci_run_id'] == os.environ['GITHUB_RUN_ID']
          assert manifest['ci_head_sha'] == os.environ['GITHUB_SHA']
          assert hashlib.sha256(state.read_bytes()).hexdigest() == manifest['state_sha256']
          payload = json.loads(state.read_text(encoding='utf-8'))
          capsule = json.loads((root / 'release-capsule.json').read_text(encoding='utf-8'))
          package = yaml.safe_load((root / 'upgrade-package.yaml').read_text(encoding='utf-8'))
          registry = yaml.safe_load((root / 'impact-registry.yaml').read_text(encoding='utf-8'))
          receipt_raw = (root / 'certification-receipt.json').read_bytes()
          receipt = json.loads(receipt_raw)
          trust = (root / 'trusted-attestation-sha256').read_text(encoding='ascii').strip()
          preplan = json.loads((root / 'consumer/.wiki-viva/upgrade/plan.json').read_text(encoding='utf-8'))
          execution_paths = sorted((root / 'consumer/.wiki-viva/upgrade').glob('execution-plan-*.json'))
          assert len(execution_paths) == 1
          execution = json.loads(execution_paths[0].read_text(encoding='utf-8'))
          trusted_acceptance = os.environ['EXPECTED_ACCEPTANCE_ANCHOR_SHA256']
          assert re.fullmatch(r'[0-9a-f]{64}', trusted_acceptance)
          assert manifest['acceptance_anchor_sha256'] == trusted_acceptance
          assert manifest['bootstrap_runner_ref'] == 'public-kit/scripts/wiki_upgrade.py'
          assert preplan['acceptance_anchor']['file_sha256'] == trusted_acceptance
          assert execution['acceptance_anchor']['file_sha256'] == trusted_acceptance
          unsigned_preplan = dict(preplan)
          assert unsigned_preplan.pop('plan_sha256') == manifest['preplan_sha256']
          assert canonical_sha256(unsigned_preplan) == manifest['preplan_sha256']
          unsigned_execution = dict(execution)
          assert unsigned_execution.pop('plan_sha256') == manifest['execution_plan_sha256']
          assert canonical_sha256(unsigned_execution) == manifest['execution_plan_sha256']
          assert capsule['source_sha'] == manifest['source_sha'] == execution['identity']['source_sha']
          assert capsule['capsule_sha256'] == manifest['capsule_sha256'] == payload['capsule_sha256']
          assert canonical_sha256(package) == manifest['package_sha256'] == execution['identity']['package_sha256']
          assert capsule['portable_tree_sha256'] == manifest['portable_tree_sha256'] == execution['identity']['portable_tree_sha256']
          assert capsule['command_registry_sha256'] == manifest['command_registry_sha256'] == execution['identity']['command_registry_sha256']
          assert capsule['toolchain_sha256'] == manifest['toolchain_sha256'] == execution['identity']['toolchain_sha256'] == payload['toolchain_sha256']
          assert execution['identity']['consumer_B0'] == manifest['consumer_B0']
          assert execution['identity']['consumer_C3'] == manifest['consumer_C3']
          assert canonical_sha256(execution['identity']) == payload['identity_sha256']
          assert verify_impact_registry(registry) == manifest['impact_registry_sha256'] == payload['impact_registry_sha256']
          assert hashlib.sha256(receipt_raw).hexdigest() == manifest['certification_receipt_sha256']
          assert receipt['receipt_sha256'] == manifest['certification_receipt_digest']
          assert receipt['source_sha'] == manifest['source_sha']
          assert receipt['capsule_sha256'] == manifest['capsule_sha256']
          assert receipt['package_sha256'] == manifest['package_sha256']
          assert receipt['portable_tree_sha256'] == manifest['portable_tree_sha256']
          assert receipt['command_registry_sha256'] == manifest['command_registry_sha256']
          assert receipt['toolchain_sha256'] == manifest['toolchain_sha256']
          assert receipt['attestation_sha256'] == trust
          assert trust == manifest['trusted_attestation_sha256']
          assert payload['status'] == 'paused_before_canary'
          assert payload['plan_sha256'] == manifest['execution_plan_sha256']
          assert execution['plan_sha256'] == manifest['execution_plan_sha256']
          assert payload['acceptance_budget'] == manifest['acceptance_budget'] == execution['acceptance_budget']
          assert canonical_sha256(payload['acceptance_budget']) == manifest['acceptance_budget_sha256']
          assert payload['acceptance_budget']['status'] == 'pending'
          PY
      - name: Resume the exact consumer through served Playwright canary
        id: served_canary
        env:
          TRUSTED_ACCEPTANCE_ANCHOR_SHA256: ${{ needs['fast-adoption'].outputs.acceptance_anchor_sha256 }}
        run: |
          ROOT="$GITHUB_WORKSPACE/.wiki-viva-ci/handoff"
          PLAN="$ROOT/consumer/.wiki-viva/upgrade/plan.json"
          TRUSTED="$(tr -d '\n' < "$ROOT/trusted-attestation-sha256")"
          CANARY_STDOUT="$(
            cd "$ROOT/public-kit"
            python "$ROOT/public-kit/scripts/wiki_upgrade.py" adopt \
              --plan "$PLAN" \
              --package "$ROOT/upgrade-package.yaml" \
              --capsule "$ROOT/release-capsule.json" \
              --impact-registry "$ROOT/impact-registry.yaml" \
              --authority "$ROOT/release-authority.json" \
              --trusted-attestation-sha256 "$TRUSTED" \
              --trusted-acceptance-anchor-sha256 "$TRUSTED_ACCEPTANCE_ANCHOR_SHA256" \
              --consumer-root "$ROOT/consumer" \
              --kit-root "$ROOT/public-kit" \
              --mode canary \
              --resume \
              --pause-before-background \
              --jobs 4 \
              --heartbeat-seconds 5
          )"
          printf '%s\n' "$CANARY_STDOUT"
          CANARY_COMPLETION_ANCHOR_SHA256="$(
            printf '%s\n' "$CANARY_STDOUT" | python -c '
          import json, sys
          payloads = [json.loads(line) for line in sys.stdin if line.startswith("{")]
          summaries = [item for item in payloads if item.get("schema_version") == "wiki_viva_upgrade_canary_completion_summary.v1"]
          if len(summaries) != 1:
              raise SystemExit("canary stdout did not contain exactly one completion anchor")
          print(summaries[0]["canary_completion_anchor_sha256"])
          '
          )"
          test "${#CANARY_COMPLETION_ANCHOR_SHA256}" -eq 64
          case "$CANARY_COMPLETION_ANCHOR_SHA256" in
            *[!0-9a-f]*) exit 1 ;;
          esac
