          }
          payload['ci_run_id'] = os.environ['GITHUB_RUN_ID']
          payload['ci_head_sha'] = os.environ['GITHUB_SHA']
          (root / 'handoff.json').write_text(
              json.dumps(payload, indent=2, sort_keys=True) + '\n', encoding='utf-8'
          )
          PY
          tar -C .wiki-viva-ci -czf "$GITHUB_WORKSPACE/.wiki-viva-ci/fast-adoption-handoff.tgz" handoff
      - name: Export out-of-band fast-adoption handoff anchor
        id: fast_handoff_anchor
        run: |
          HANDOFF_ARCHIVE_SHA256="$(python -c 'import hashlib; from pathlib import Path; print(hashlib.sha256(Path(".wiki-viva-ci/fast-adoption-handoff.tgz").read_bytes()).hexdigest())')"
