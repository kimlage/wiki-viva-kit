name: wiki-upgrade-two-lane

on:
  pull_request:
    paths:
      - ".github/workflows/wiki-upgrade-lanes.yml"
      - ".skills/wiki-*/**"
      - "docs/references/fixtures/demo-wiki/**"
      - "docs/references/guides/**"
      - "docs/references/schemas/**"
      - "docs/references/templates/deploy/**"
      - "docs/references/upgrades/wiki-viva-v8/**"
      - "packs/**"
      - "requirements.txt"
      - "scripts/README.md"
      - "scripts/_common.py"
      - "scripts/_git_subject.py"
      - "scripts/wiki_toolchain_probe.py"
      - "scripts/wiki_*.py"
      - "scripts/wiki_upgrade*.py"
      - "scripts/wiki_visual_evidence.py"
      - "tests/test_upgrade*.py"
      - "tests/test_wiki_upgrade_cli.py"
      - "tests/test_wiki_visual_evidence.py"
      - "wiki_core/**"
      - "apps/wiki-cockpit/**"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wiki-upgrade-two-lane-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  upstream-certification:
    name: Upstream certification (public synthetic)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      trusted_attestation_sha256: ${{ steps.lane_a_trust.outputs.trusted_attestation_sha256 }}
      lane_a_archive_sha256: ${{ steps.lane_a_archive_anchor.outputs.lane_a_archive_sha256 }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/wiki-cockpit/package-lock.json
      - name: Install certification toolchain
        run: |
          python -m pip install -r requirements.txt playwright==1.61.1
          npm --prefix apps/wiki-cockpit ci
          echo "$GITHUB_WORKSPACE/apps/wiki-cockpit/node_modules/.bin" >> "$GITHUB_PATH"
          python -m playwright install --with-deps chromium
      - name: Verify capsule, command registry and public impact contracts
        run: >-
          python -m pytest -q tests/test_upgrade_lanes.py
          -k "published_gate_classes or public_registry or release_capsule"
      - name: Verify visual evidence implementation
        run: python -m pytest -q tests/test_wiki_visual_evidence.py
      - name: Verify package v3 schema, gate DAG and v1/v2 compatibility
        run: python -m pytest -q tests/test_upgrade_package_v3.py
      - name: Verify upgrade-package schema and exact command catalog
        run: >-
          python -m pytest -q tests/test_upgrade.py
          -k "upgrade_package"
      - name: Prepare an uncertified public synthetic Lane A subject
        env:
          WIKI_UPGRADE_CI_CERTIFICATION_INPUTS: ${{ github.workspace }}/.wiki-viva-ci/lane-a-inputs
        run: >-
          python -m pytest -q
          tests/test_wiki_upgrade_cli.py::test_ci_lane_a_inputs_export_only_public_uncertified_fixture
      - name: Prepare exact public cockpit source for productive capture
        run: |
          ROOT=.wiki-viva-ci/lane-a-inputs
          git archive HEAD .gitignore apps/wiki-cockpit scripts/wiki_visual_evidence.py \
            | tar -x -C "$ROOT/public-kit"
          git -C "$ROOT/public-kit" add \
            .gitignore apps/wiki-cockpit scripts/wiki_visual_evidence.py
          git -C "$ROOT/public-kit" commit -q -m "add productive visual capture subject"
          SOURCE_SHA="$(git -C "$ROOT/public-kit" rev-parse HEAD)"
          SOURCE_SHA="$SOURCE_SHA" python - <<'PY'
          import os
          from pathlib import Path
          import yaml
          path = Path('.wiki-viva-ci/lane-a-inputs/upgrade-package.yaml')
          package = yaml.safe_load(path.read_text(encoding='utf-8'))
          package['release']['source_sha'] = os.environ['SOURCE_SHA']
          path.write_text(yaml.safe_dump(package, sort_keys=False), encoding='utf-8')
          PY
          rm -rf "$ROOT/release-authority"
          npm --prefix "$ROOT/public-kit/apps/wiki-cockpit" ci
      - name: Capture productive public visual authority
        run: |
          ROOT=.wiki-viva-ci/lane-a-inputs
          SOURCE_SHA="$(git -C "$ROOT/public-kit" rev-parse HEAD)"
          python "$ROOT/public-kit/scripts/wiki_visual_evidence.py" capture \
            --package "$ROOT/upgrade-package.yaml" \
            --source-root "$ROOT/public-kit" \
            --source-sha "$SOURCE_SHA" \
            --out-dir "$ROOT/productive-visual" \
            > "$ROOT/productive-visual-capture.json"
          python - <<'PY'
          import json
          from pathlib import Path
          capture = json.loads(
              Path('.wiki-viva-ci/lane-a-inputs/productive-visual-capture.json')
              .read_text(encoding='utf-8')
          )
          assert capture['status'] == 'verified'
          assert capture['trust'] == {
              'capture_provenance': 'observed_in_this_capture_process',
              'productive_authority': False,
              'release_authority': 'requires_external_capture_attestation',
          }
          PY
      - name: Execute and seal the operator-facing Lane A certification
        run: |
          ROOT=.wiki-viva-ci/lane-a-inputs
          python scripts/wiki_upgrade.py certify \
            --package "$ROOT/upgrade-package.yaml" \
            --impact-registry "$ROOT/impact-registry.yaml" \
            --source-root "$ROOT/public-kit" \
            --visual-root "$ROOT/productive-visual" \
            --visual-manifest-ref visual-manifest.json \
            --out-dir .wiki-viva-ci/lane-a-certified \
            --attestation-authority-id github-actions \
            --run-id "lane-a-${GITHUB_RUN_ID}" \
            --jobs 4 \
            --heartbeat-seconds 5
      - name: Verify immutable Lane A artifact set
        run: |
          python - <<'PY'
          import json
          import hashlib
          from pathlib import Path
          root = Path('.wiki-viva-ci/lane-a-certified')
          required = [
              'release-capsule.json', 'certification-receipt.json',
              'release-authority.json', 'trusted-attestation-sha256.txt',
              'gate-output/execution-attestation.json',
              'gate-output/toolchain/probe-manifest.json',
              'visual/visual-manifest.json',
              'visual/records/desktop.json',
          ]
          assert all((root / relative).is_file() for relative in required)
          capsule = json.loads((root / 'release-capsule.json').read_text())
          receipt = json.loads((root / 'certification-receipt.json').read_text())
          capture = json.loads(
              Path('.wiki-viva-ci/lane-a-inputs/productive-visual-capture.json')
              .read_text(encoding='utf-8')
          )
          captured_root = Path('.wiki-viva-ci/lane-a-inputs/productive-visual')
          certified_root = root / 'visual'
          def hashes(subject):
              return {
                  path.relative_to(subject).as_posix(): hashlib.sha256(
                      path.read_bytes()
                  ).hexdigest()
                  for path in sorted(subject.rglob('*'))
                  if path.is_file() and not path.is_symlink()
              }
          assert hashes(certified_root) == hashes(captured_root)
          assert capsule['visual_manifest_sha256'] == capture['visual_manifest_sha256']
          assert receipt['status'] == 'passed'
          assert receipt['human_gate_required'] is True
          assert receipt['upstream_gate_ids']
          assert receipt['certification_gate_ids'] == receipt['upstream_gate_ids']
          assert 'background_gate_ids' not in receipt
          assert all(
              result['class'] == 'upstream_certified'
              for result in receipt['gate_results']
          )
          PY
      - name: Independently verify the sealed Lane A capsule
        run: |
          ROOT=.wiki-viva-ci/lane-a-inputs
          CERTIFIED=.wiki-viva-ci/lane-a-certified
          TRUSTED_ATTESTATION_SHA256="$(tr -d '\n' < "$CERTIFIED/trusted-attestation-sha256.txt")"
          python scripts/wiki_upgrade.py verify-capsule \
            --package "$ROOT/upgrade-package.yaml" \
            --capsule "$CERTIFIED/release-capsule.json" \
            --impact-registry "$ROOT/impact-registry.yaml" \
            --authority "$CERTIFIED/release-authority.json" \
            --trusted-attestation-sha256 "$TRUSTED_ATTESTATION_SHA256" \
            --kit-root "$ROOT/public-kit"
      - name: Export out-of-band Lane A trust anchor
        id: lane_a_trust
        run: |
          TRUSTED_ATTESTATION_SHA256="$(tr -d '\n' < .wiki-viva-ci/lane-a-certified/trusted-attestation-sha256.txt)"
          test "${#TRUSTED_ATTESTATION_SHA256}" -eq 64
          case "$TRUSTED_ATTESTATION_SHA256" in
            *[!0-9a-f]*) exit 1 ;;
          esac
          echo "trusted_attestation_sha256=$TRUSTED_ATTESTATION_SHA256" >> "$GITHUB_OUTPUT"
      - name: Assemble fail-closed cross-job Lane A bundle
        run: |
          rm -rf .wiki-viva-ci/lane-a-bundle
          mkdir -p .wiki-viva-ci/lane-a-bundle/inputs
          cp -R .wiki-viva-ci/lane-a-certified .wiki-viva-ci/lane-a-bundle/certified
          cp .wiki-viva-ci/lane-a-inputs/upgrade-package.yaml .wiki-viva-ci/lane-a-bundle/inputs/
          cp .wiki-viva-ci/lane-a-inputs/impact-registry.yaml .wiki-viva-ci/lane-a-bundle/inputs/
          cp -R .wiki-viva-ci/lane-a-inputs/public-kit .wiki-viva-ci/lane-a-bundle/inputs/public-kit
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          import yaml
          from wiki_core.upgrade_lanes import canonical_sha256, verify_impact_registry
          root = Path('.wiki-viva-ci/lane-a-bundle')
          capsule = json.loads((root / 'certified/release-capsule.json').read_text())
          receipt_raw = (root / 'certified/certification-receipt.json').read_bytes()
          receipt = json.loads(receipt_raw)
          package = yaml.safe_load((root / 'inputs/upgrade-package.yaml').read_text())
          registry = yaml.safe_load((root / 'inputs/impact-registry.yaml').read_text())
          trust = (root / 'certified/trusted-attestation-sha256.txt').read_text().strip()
          unsigned_receipt = dict(receipt)
          assert unsigned_receipt.pop('receipt_sha256') == canonical_sha256(unsigned_receipt)
          assert canonical_sha256(package) == capsule['package_sha256']
          assert verify_impact_registry(registry) == registry['registry_sha256']
          assert receipt['source_sha'] == capsule['source_sha']
          assert receipt['capsule_sha256'] == capsule['capsule_sha256']
          assert receipt['package_sha256'] == capsule['package_sha256']
          assert receipt['portable_tree_sha256'] == capsule['portable_tree_sha256']
          assert receipt['command_registry_sha256'] == capsule['command_registry_sha256']
          assert receipt['toolchain_sha256'] == capsule['toolchain_sha256']
          assert receipt['attestation_sha256'] == trust
          files = []
          for path in sorted(root.rglob('*')):
              if path.is_symlink():
                  raise SystemExit(f'Lane A bundle refuses symlink: {path}')
              if not path.is_file() or path.name == 'bundle-manifest.json':
                  continue
              raw = path.read_bytes()
              files.append({
                  'path': path.relative_to(root).as_posix(),
                  'sha256': hashlib.sha256(raw).hexdigest(),
                  'bytes': len(raw),
              })
          manifest = {
              'schema_version': 'wiki_viva_upgrade_lane_a_bundle.v1',
              'source_sha': capsule['source_sha'],
              'capsule_sha256': capsule['capsule_sha256'],
              'package_sha256': capsule['package_sha256'],
              'portable_tree_sha256': capsule['portable_tree_sha256'],
              'command_registry_sha256': capsule['command_registry_sha256'],
              'toolchain_sha256': capsule['toolchain_sha256'],
              'impact_registry_sha256': registry['registry_sha256'],
              'certification_receipt_sha256': hashlib.sha256(receipt_raw).hexdigest(),
              'certification_receipt_digest': receipt['receipt_sha256'],
              'trusted_attestation_sha256': trust,
              'files': files,
          }
          (root / 'bundle-manifest.json').write_text(
              json.dumps(manifest, indent=2, sort_keys=True) + '\n', encoding='utf-8'
          )
          PY
          tar -C .wiki-viva-ci -czf .wiki-viva-ci/lane-a-release.tgz lane-a-bundle
      - name: Export out-of-band Lane A archive anchor
        id: lane_a_archive_anchor
        run: |
          LANE_A_ARCHIVE_SHA256="$(python -c 'import hashlib; from pathlib import Path; print(hashlib.sha256(Path(".wiki-viva-ci/lane-a-release.tgz").read_bytes()).hexdigest())')"
          test "${#LANE_A_ARCHIVE_SHA256}" -eq 64
          case "$LANE_A_ARCHIVE_SHA256" in
            *[!0-9a-f]*) exit 1 ;;
          esac
          echo "lane_a_archive_sha256=$LANE_A_ARCHIVE_SHA256" >> "$GITHUB_OUTPUT"
      - name: Upload immutable Lane A capsule, receipt, toolchain and visual authority
        uses: actions/upload-artifact@v7
        with:
          name: wiki-upgrade-lane-a-${{ runner.os }}-${{ github.run_id }}
          overwrite: true
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 30
          path: .wiki-viva-ci/lane-a-release.tgz

  fast-adoption:
    name: Fast adoption (public synthetic consumer)
    needs: upstream-certification
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      handoff_archive_sha256: ${{ steps.fast_handoff_anchor.outputs.handoff_archive_sha256 }}
      acceptance_anchor_sha256: ${{ steps.fast_adoption.outputs.acceptance_anchor_sha256 }}
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Download exact Lane A release bundle
        uses: actions/download-artifact@v7
        with:
          name: wiki-upgrade-lane-a-${{ runner.os }}-${{ github.run_id }}
          path: .wiki-viva-ci/incoming-lane-a
      - name: Verify and restore exact Lane A release bundle
        env:
          TRUSTED_LANE_A_ATTESTATION_SHA256: ${{ needs['upstream-certification'].outputs.trusted_attestation_sha256 }}
          EXPECTED_LANE_A_ARCHIVE_SHA256: ${{ needs['upstream-certification'].outputs.lane_a_archive_sha256 }}
        run: |
          python - <<'PY'
          import hashlib, hmac, os, re
          from pathlib import Path
          archive = Path('.wiki-viva-ci/incoming-lane-a/lane-a-release.tgz')
          expected = os.environ['EXPECTED_LANE_A_ARCHIVE_SHA256']
          if re.fullmatch(r'[0-9a-f]{64}', expected) is None:
              raise SystemExit('missing or invalid out-of-band Lane A archive SHA-256')
          actual = hashlib.sha256(archive.read_bytes()).hexdigest()
          if not hmac.compare_digest(actual, expected):
              raise SystemExit('Lane A archive does not match its out-of-band SHA-256')
          PY
          mkdir -p .wiki-viva-ci/lane-a
          tar -C .wiki-viva-ci/lane-a -xzf .wiki-viva-ci/incoming-lane-a/lane-a-release.tgz
          python - <<'PY'
          import hashlib, json, os, re
          from pathlib import Path
          root = Path('.wiki-viva-ci/lane-a/lane-a-bundle')
          manifest = json.loads((root / 'bundle-manifest.json').read_text())
          assert manifest['schema_version'] == 'wiki_viva_upgrade_lane_a_bundle.v1'
          expected = {item['path']: item for item in manifest['files']}
          observed = {}
          for path in sorted(root.rglob('*')):
              if path.is_symlink():
                  raise SystemExit(f'Lane A bundle contains symlink: {path}')
              if not path.is_file() or path.name == 'bundle-manifest.json':
                  continue
              raw = path.read_bytes()
              observed[path.relative_to(root).as_posix()] = {
                  'path': path.relative_to(root).as_posix(),
                  'sha256': hashlib.sha256(raw).hexdigest(),
                  'bytes': len(raw),
              }
          assert observed == expected
          capsule = json.loads((root / 'certified/release-capsule.json').read_text())
          assert capsule['source_sha'] == manifest['source_sha']
          assert capsule['capsule_sha256'] == manifest['capsule_sha256']
          assert capsule['package_sha256'] == manifest['package_sha256']
          assert capsule['portable_tree_sha256'] == manifest['portable_tree_sha256']
          assert capsule['command_registry_sha256'] == manifest['command_registry_sha256']
          assert capsule['toolchain_sha256'] == manifest['toolchain_sha256']
          trusted_out_of_band = os.environ['TRUSTED_LANE_A_ATTESTATION_SHA256']
          assert re.fullmatch(r'[0-9a-f]{64}', trusted_out_of_band)
          assert (root / 'certified/trusted-attestation-sha256.txt').read_text().strip() == manifest['trusted_attestation_sha256'] == trusted_out_of_band
          PY
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/wiki-cockpit/package-lock.json
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt playwright==1.61.1
      - name: Install the certified Playwright command registry
        run: |
          npm --prefix apps/wiki-cockpit ci
          echo "$GITHUB_WORKSPACE/apps/wiki-cockpit/node_modules/.bin" >> "$GITHUB_PATH"
          python -m playwright install --with-deps chromium
      - name: Verify impact, exact receipt identity, resume and C1/C2/C3 ownership
        run: >-
          python -m pytest -q tests/test_upgrade_lanes.py
          -k "known_delta or unknown_path or portable_path or adoption_receipt
          or receipt_reuse or c3_changed or resume_state or gate_omission
          or never_reusable or manual_or_fabricated or private_host
          or private_data or c1_c2_c3 or c1_requires or missing_selected"
      - name: Verify read-only preflight and generated report on synthetic Git repos
        run: >-
          python -m pytest -q tests/test_upgrade.py
          -k "upgrade_cli_entrypoints_execute_end_to_end_on_synthetic_consumer
          or preflight_cli_private_sidecar_is_authoritative_and_never_echoed"
      - name: Verify fail-closed planning surfaces without entering canary
        run: >-
          python -m pytest -q tests/test_wiki_upgrade_cli.py
          -k "unknown_impact or plan_refuses or forged_omission or upgrade_command"
      - name: Execute fast adoption and seal resumable runner handoff
        id: fast_adoption
        env:
          LANE_A_ROOT: ${{ github.workspace }}/.wiki-viva-ci/lane-a/lane-a-bundle
          WIKI_UPGRADE_CI_LANE_A: ${{ github.workspace }}/.wiki-viva-ci/lane-a/lane-a-bundle
          HANDOFF_ROOT: ${{ github.workspace }}/.wiki-viva-ci/handoff
        run: |
          set -euo pipefail
          env -u WIKI_UPGRADE_CI_HANDOFF python -m pytest -q \
            tests/test_wiki_upgrade_cli.py::test_ci_fast_adoption_consumes_exact_upstream_lane_a_bundle
          rm -rf "$HANDOFF_ROOT"
          mkdir -p "$HANDOFF_ROOT"
          cp -R "$LANE_A_ROOT/inputs/." "$HANDOFF_ROOT/"
          cp -R "$LANE_A_ROOT/certified/." "$HANDOFF_ROOT/"
          cp "$HANDOFF_ROOT/trusted-attestation-sha256.txt" \
            "$HANDOFF_ROOT/trusted-attestation-sha256"

          CONSUMER="$HANDOFF_ROOT/consumer"
          mkdir -p "$CONSUMER"
          git init -q "$CONSUMER"
          git -C "$CONSUMER" config user.email synthetic@example.invalid
          git -C "$CONSUMER" config user.name "Synthetic CI"
          printf '.wiki-viva/\n' > "$CONSUMER/.gitignore"
          printf 'repo_id: synthetic-consumer\n' > "$CONSUMER/wiki.config.yaml"
          git -C "$CONSUMER" add .
          git -C "$CONSUMER" commit -q -m "synthetic consumer B0"
          git -C "$CONSUMER" checkout -q -b wiki/synthetic-upgrade

          RUNNER="$HANDOFF_ROOT/public-kit/scripts/wiki_upgrade.py"
          (
            cd "$HANDOFF_ROOT/public-kit"
            python "$RUNNER" --version
          )
          TRUSTED_ATTESTATION_SHA256="$(tr -d '\n' < "$HANDOFF_ROOT/trusted-attestation-sha256")"
          C3_ADAPTER_COMMAND="adapt_config::python3 -c \"from pathlib import Path; Path('wiki.config.yaml').write_text('repo_id: synthetic-consumer-v8\\n', encoding='utf-8')\""
          PLAN_STDOUT="$(
            cd "$HANDOFF_ROOT/public-kit"
            python "$RUNNER" plan \
              --package "$HANDOFF_ROOT/upgrade-package.yaml" \
              --capsule "$HANDOFF_ROOT/release-capsule.json" \
              --impact-registry "$HANDOFF_ROOT/impact-registry.yaml" \
              --authority "$HANDOFF_ROOT/release-authority.json" \
              --trusted-attestation-sha256 "$TRUSTED_ATTESTATION_SHA256" \
              --consumer-root "$CONSUMER" \
              --kit-root "$HANDOFF_ROOT/public-kit" \
              --changed-path wiki.config.yaml \
              --c3-adapter-command "$C3_ADAPTER_COMMAND" \
              --out "$CONSUMER/.wiki-viva/upgrade/plan.json"
          )"
          printf '%s\n' "$PLAN_STDOUT"
          ACCEPTANCE_ANCHOR_SHA256="$(
            printf '%s\n' "$PLAN_STDOUT" | python -c '
          import json, sys
          payloads = [json.loads(line) for line in sys.stdin if line.startswith("{")]
          summaries = [item for item in payloads if item.get("schema_version") == "wiki_viva_upgrade_plan_summary.v1"]
          if len(summaries) != 1:
              raise SystemExit("plan stdout did not contain exactly one acceptance anchor")
          print(summaries[0]["acceptance_anchor_sha256"])
          '
          )"
          test "${#ACCEPTANCE_ANCHOR_SHA256}" -eq 64
          case "$ACCEPTANCE_ANCHOR_SHA256" in
            *[!0-9a-f]*) exit 1 ;;
          esac
          export ACCEPTANCE_ANCHOR_SHA256
          echo "acceptance_anchor_sha256=$ACCEPTANCE_ANCHOR_SHA256" >> "$GITHUB_OUTPUT"

          (
            cd "$HANDOFF_ROOT/public-kit"
            python "$RUNNER" adopt \
              --plan "$CONSUMER/.wiki-viva/upgrade/plan.json" \
              --package "$HANDOFF_ROOT/upgrade-package.yaml" \
              --capsule "$HANDOFF_ROOT/release-capsule.json" \
              --impact-registry "$HANDOFF_ROOT/impact-registry.yaml" \
              --authority "$HANDOFF_ROOT/release-authority.json" \
              --trusted-attestation-sha256 "$TRUSTED_ATTESTATION_SHA256" \
              --trusted-acceptance-anchor-sha256 "$ACCEPTANCE_ANCHOR_SHA256" \
              --consumer-root "$CONSUMER" \
              --kit-root "$HANDOFF_ROOT/public-kit" \
              --mode canary \
              --pause-before-canary \
              --jobs 4 \
              --heartbeat-seconds 5
          )

          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          root = Path(os.environ['HANDOFF_ROOT'])
          lane_a = Path(os.environ['LANE_A_ROOT'])
          upstream = json.loads((lane_a / 'bundle-manifest.json').read_text(encoding='utf-8'))
          preplan = json.loads((root / 'consumer/.wiki-viva/upgrade/plan.json').read_text(encoding='utf-8'))
          execution_paths = sorted((root / 'consumer/.wiki-viva/upgrade').glob('execution-plan-*.json'))
          assert len(execution_paths) == 1
          execution = json.loads(execution_paths[0].read_text(encoding='utf-8'))
          run_key = execution['plan_sha256'][:16]
          state_path = root / 'consumer/.wiki-viva/upgrade/runs' / run_key / 'state.json'
          state = json.loads(state_path.read_text(encoding='utf-8'))
          acceptance_anchor = os.environ['ACCEPTANCE_ANCHOR_SHA256']
          assert preplan['acceptance_anchor']['file_sha256'] == acceptance_anchor
          assert execution['acceptance_anchor']['file_sha256'] == acceptance_anchor
          assert state['status'] == 'paused_before_canary'
          assert state['plan_sha256'] == execution['plan_sha256']
          payload = {
              'schema_version': 'wiki_viva_upgrade_ci_handoff.v3',
              'preplan_sha256': preplan['plan_sha256'],
              'execution_plan_sha256': execution['plan_sha256'],
              'run_key': run_key,
              'state_sha256': hashlib.sha256(state_path.read_bytes()).hexdigest(),
              'source_sha': upstream['source_sha'],
              'capsule_sha256': upstream['capsule_sha256'],
              'package_sha256': upstream['package_sha256'],
              'portable_tree_sha256': upstream['portable_tree_sha256'],
              'consumer_B0': execution['identity']['consumer_B0'],
              'consumer_C3': execution['identity']['consumer_C3'],
              'command_registry_sha256': upstream['command_registry_sha256'],
              'toolchain_sha256': upstream['toolchain_sha256'],
              'impact_registry_sha256': upstream['impact_registry_sha256'],
              'certification_receipt_sha256': upstream['certification_receipt_sha256'],
              'certification_receipt_digest': upstream['certification_receipt_digest'],
              'trusted_attestation_sha256': upstream['trusted_attestation_sha256'],
              'acceptance_anchor_sha256': acceptance_anchor,
              'acceptance_budget': state['acceptance_budget'],
              'acceptance_budget_sha256': hashlib.sha256(
                  json.dumps(
                      state['acceptance_budget'],
                      ensure_ascii=False,
                      sort_keys=True,
                      separators=(',', ':'),
