# Local profile of this repo: maps context -> impacted pages and entities, used by
# scripts/wiki_new_ingest.py. It is NOT part of the generic kit — each repo defines
# its own. The script stays agnostic; specific names live only here.
system:
  pages:
    - memories/index.md
    - memories/system/operational-wiki-contract.md
  entities:
    - holon-system
    - role-wiki-steward
    - responsibility-maintain-operational-wiki

example:
  pages:
    - memories/example/index.md
  entities:
    - holon-example
    - role-example-curator
