# Declarative template registry (wiki_templates.v1)
#
# The page TYPE drives VIEW + INTERACTION. `wiki.page-types.yaml` stays the
# validation contract; this file adds the presentation contract the cockpit
# interprets. A custom wiki overrides/extends any of this in
# `wiki.templates.local.yaml` (merged on top) — composing the FIXED primitive
# vocabulary (panels: list|table|timeline|badges|text|diff, controls:
# brief|nav|filter|run|focus, badges: freshness|evidence|approval|privacy|sync,
# center: document|timeline|dashboard|entity, scene shapes). New primitives need
# code; the loader validates the vocabulary (WARN gate).
#
# `facets:` maps each Focus-view lens to the frontmatter fields that fill it,
# one lens per AQAL quadrant — intencao (q1: identity and intent), pratica
# (q2: outputs and evidence), relacoes (q3: culture and relations), sistemas
# (q4: systems and governance). Absent keys degrade to today's reader.

schema_version: wiki_templates.v2

# --- v2 vocabulary (informational) -----------------------------------------
# The SOURCE OF TRUTH for the block vocabulary is wiki_core/template_blocks.py
# (constants + validator). This block documents it for template authors; a new
# surface/provider/landmark needs code there, never just YAML here.
vocabulary:
  block_kinds: [interpretation, interface, gate, skill]
  scope_modes: [self, children, descendants, context]
  surfaces: [views, missions, create, intake, score, panels]
  scene_layouts: [quadrants, radar, atlas, districts, trails, focus]
  identity_landmarks: [observatory, beacon, crystal_spire, plaza, forge, shelf, engine]
  identity_motifs: [rings, grid, ledger, shelves, orbits, streams, none]
  identity_ambients: [none, motes, drift]

# --- v2 packages -----------------------------------------------------------
# A PACKAGE is a named group of blocks — attachment sugar for setup flows and
# frontmatter (`packages: [gamification]`). Blocks remain the primitive; a
# package expands to its blocks, in order, at the ring where it is attached.
packages:
  gamification:
    title: "Honest gamification"
    summary: "Missions, weather and karma — data transformed into requests for attention. No leaderboard, ever."
    blocks: [wiki.block.ui_missions.v1, wiki.block.gamification.v1]
  quadrant_lenses:
    title: "Quadrant lenses"
    summary: "The four AQAL lenses with full interiors, plus the relations module on Q3."
    blocks: [wiki.block.quadrants.v1, wiki.block.relations.v1]

# --- v2 blocks -------------------------------------------------------------
# A block contributes interpretation, interface, gate or skill to a scope. It
# is REFERENCED by types (types.<t>.blocks) or by anchor pages (frontmatter
# blocks:). Interpretation blocks REFERENCE perspective pages (the lens content
# lives there, human + PR-gated); they never duplicate extraction here.
blocks:
  wiki.block.quadrants.v1:
    kind: interpretation
    family: quadrants
    title: "Quadrants"
    summary: "Four AQAL lenses with full interiors over any anchored scope."
    contract_ref: wiki_core.quadrants
    perspectives:
      q1: perspective-identity-intent
      q2: perspective-artifacts-evidence
      q3: perspective-roles-relationships
      q4: perspective-systems-processes
    scope: { default_mode: descendants, allowed_modes: [children, descendants, context] }
    anchors: [root_entity, context_hub, holon, project, source, template_block]
    fields:
      optional_frontmatter:
        - home_quadrant
        - observed_quadrants
        - sub_lens
        - parent_projection
        - subject_ref
        - subject_role
        - projection_overrides
    config_schema:
      labels: { q1: string, q2: string, q3: string, q4: string }
      required_quadrants: list
      mode: enum:required,optional_lens
      nested_mode: enum:summarize,project_all,hide_nested
    contributes:
      create_arrangement: by_quadrant
      views_extra_default: quadrants
      missions_providers: [quadrant_absence]
    scene_profile: { layout: quadrants, overlays: [], hud: [{ kind: badges }], fallback: quadrant_board_2d }
    skills: { agent: [skill-agent-classify-quadrants] }
    gates:
      warnings: [page_has_no_quadrant_signal]
      errors: [required_quadrant_absence_without_reason]

  wiki.block.perspective_bundle.v1:
    kind: interpretation
    family: perspective_bundle
    title: "Perspective bundle"
    summary: "Attach any perspective pages as required/optional lenses for this scope."
    scope: { default_mode: descendants }
    anchors: [root_entity, context_hub, holon, project, source]
    config_schema: { required: list, optional: list }

  wiki.block.relations.v1:
    kind: interpretation
    family: relations
    title: "Relations"
    summary: "People below this anchor read as a cared-for network: bond, cadence, dates, open loops."
    scope: { default_mode: descendants }
    anchors: [root_entity, context_hub, holon]
    perspectives: { q3: perspective-roles-relationships }
    contributes:
      missions_providers: [relation_cadence_overdue, date_upcoming, commitment_open]
      intake_forms: [meeting_note, interaction_note]
    scene_profile: { layout: null, overlays: [], hud: [{ kind: table }], fallback: table }
    gates: { warnings: [person_without_relationship_block] }

  wiki.block.privacy_boundary.v1:
    kind: gate
    family: privacy_boundary
    title: "Privacy boundary"
    summary: "Most-restrictive visibility wins below this anchor; leaks become gate errors."
    scope: { default_mode: descendants, allowed_modes: [descendants, context] }
    anchors: [root_entity, context_hub, holon]
    scene_profile: { layout: null, overlays: [privacy_ring], hud: [], fallback: table }
    gates: { errors: [public_leak_of_private_scope] }

  wiki.block.git_human_gate.v1:
    kind: gate
    family: git_human_gate
    title: "Git human gate"
    summary: "All writes below this anchor are proposal-branch + PR only."
    scope: { default_mode: descendants, allowed_modes: [descendants] }
    anchors: [root_entity, context_hub, holon, project]
    scene_profile: { layout: null, overlays: [approval_halo], hud: [], fallback: list }
    gates: { errors: [direct_write_to_main] }

  wiki.block.source_recipe.v1:
    kind: gate
    family: source_recipe
    title: "Source recipe"
    summary: "The source's recipe must be valid and secret-free before it can sync."
    scope: { default_mode: self }
    anchors: [source]
    scene_profile: { layout: null, overlays: [stream_particles], hud: [], fallback: table }
    gates: { errors: [recipe_invalid, secret_in_recipe] }

  wiki.block.ui_views.v1:
    kind: interface
    surface: views
    family: ui_views
    title: "Views"
    summary: "Which perspectives this scope offers, and which is home."
    scope: { default_mode: descendants }
    anchors: [root_entity, context_hub, holon, project, source]
    config_schema: { available: list, default: enum }

  wiki.block.ui_missions.v1:
    kind: interface
    surface: missions
    family: ui_missions
    title: "Missions"
    summary: "Which mission providers run for this scope, with which rules."
    scope: { default_mode: descendants }
    anchors: [root_entity, context_hub, holon, project, source]
    config_schema: { providers: list, weather_contrib: bool, quiet: bool }
    # Providers that run when the block is attached with no explicit config
    # (e.g. via the gamification package). Interpretation blocks still ADD
    # their own via contributes.missions_providers.
    defaults:
      providers: [stale, gates_failing, approvals_pending, template_conformity, source_closure]

  wiki.block.ui_create.v1:
    kind: interface
    surface: create
    family: ui_create
    title: "Create"
    summary: "What can be seeded below this anchor, and how the palette is arranged."
    scope: { default_mode: descendants }
    anchors: [root_entity, context_hub, holon, project, source]
    config_schema:
      catalog: list
      arrangement: enum:by_quadrant,by_family,by_frequency
      obligations_first: bool
      disabled_reason: string

  wiki.block.ui_intake.v1:
    kind: interface
    surface: intake
    family: ui_intake
    title: "Intake"
    summary: "The ingestion forms this scope accepts — its ways in."
    scope: { default_mode: self }
    anchors: [root_entity, context_hub, source]
    config_schema: { forms: list, route_hint: string }

  wiki.block.gamification.v1:
    kind: interface
    surface: score
    family: gamification
    title: "Honest gamification"
    summary: "Which honesty loops score this scope. No leaderboard, ever."
    scope: { default_mode: descendants }
    anchors: [root_entity, context_hub, holon, project]
    config_schema:
      loops: list
      no_leaderboard: { const: true }

bases:
  # Every content page that carries typed relations. The facet mapping here is
  # the sensible default; specific types override the lenses they emphasize.
  relation_base:
    pinned_fields: [updated_at, source_refs]
    facets:
      intencao: [decisions, responsibilities, claims, insights]
      pratica: [actions, evidence_refs]
      relacoes: [roles, related_holons, people]
      sistemas: [source_refs, process_refs]
    view:
      center: document
      badges: [freshness, evidence]
      panels:
        - { kind: badges }
    controls:
      - { kind: focus }
      - { kind: nav, rel: moc_parent }
    scene: { shape: sphere, emphasis: none }

types:
  # --- Intention-leaning ------------------------------------------------------
  decision:
    extends: relation_base
    body_template: docs/references/templates/wiki/decision.md
    pinned_fields: [updated_at, status, claims]
    view:
      center: document
      badges: [freshness, evidence]
      panels:
        - { kind: list, from: claims, label: reader.claims }
        - { kind: list, from: actions, label: reader.actions }
    scene: { shape: diamond, emphasis: intention }
  operational_rule:
    extends: relation_base
    body_template: docs/references/templates/wiki/gate.md
    scene: { shape: diamond, emphasis: intention }
  responsibility:
    extends: relation_base
    body_template: docs/references/templates/wiki/responsibility.md
  project:
    extends: relation_base
    body_template: docs/references/templates/wiki/project.md
    pinned_fields: [updated_at, status]
    view: { center: dashboard, badges: [freshness] }
    can_anchor_blocks: true
    identity: { landmark: forge, motif: orbits, ambient: none, horizon_label: title }
    subpages:
      - { rel: decisions_index, page_type: ontology_index, required: false }
    blocks:
      - { id: wiki.block.ui_views.v1, config: { default: trails } }
      - { id: wiki.block.quadrants.v1, scope: descendants, config: { mode: optional_lens } }
      - { id: wiki.block.ui_missions.v1, config: { providers: [stale, template_conformity] } }
      - { id: wiki.block.ui_create.v1, config: { catalog: [action, decision, artifact, claim, meeting] } }
      - { id: wiki.block.gamification.v1, config: { loops: [mission_health] } }
  initiative:
    extends: relation_base
    body_template: docs/references/templates/wiki/initiative.md
    view: { center: dashboard, badges: [freshness] }
    # No wiki.page-types.yaml contract yet — wiki_new would refuse it. The
    # palette must not offer what cannot be born.
    creatable: false

  # --- Perception-leaning -----------------------------------------------------
  claim:
    extends: relation_base
    body_template: docs/references/templates/wiki/claim.md
    pinned_fields: [updated_at, source_refs, perspectives_required]
    view:
      center: document
      badges: [freshness, evidence]
      panels:
        - { kind: list, from: evidence_refs, label: reader.evidence }
    scene: { shape: sphere, emphasis: perception }
  insight:
    extends: relation_base
    body_template: docs/references/templates/wiki/insight.md
    scene: { shape: spark, emphasis: perception }
    # No wiki.page-types.yaml contract yet — wiki_new would refuse it.
    creatable: false
  journal_entry:
    extends: relation_base
    body_template: docs/references/templates/wiki/journal.md
    view: { center: timeline, badges: [freshness] }
  perspective:
    extends: relation_base
    body_template: docs/references/templates/wiki/perspective.md

  # --- Outputs/evidence-leaning ----------------------------------------------
  action:
    extends: relation_base
    body_template: docs/references/templates/wiki/action.md
    pinned_fields: [updated_at, status]
    scene: { shape: comet, emphasis: practice }
  process:
    extends: relation_base
    body_template: docs/references/templates/wiki/process.md
    scene: { shape: slab, emphasis: practice }
  artifact:
    extends: relation_base
    body_template: docs/references/templates/wiki/artifact.md
    scene: { shape: crystal, emphasis: practice }
  dashboard:
    extends: relation_base
    body_template: docs/references/templates/wiki/operation.md
    view: { center: dashboard, badges: [freshness] }
    scene: { shape: slab, emphasis: practice }

  # --- Source family (Pillar A: the source entity) ---------------------------
  source:
    extends: relation_base
    body_template: docs/references/templates/wiki/source.md
    pinned_fields: [platform, owner, updated_at]
    facets:
      intencao: [decisions, claims]
      pratica: [evidence_refs]
      relacoes: [owner, stewards]
      sistemas: [target_pages, source_refs]
    view:
      center: entity
      badges: [sync, freshness, privacy]
      panels:
        - { kind: table, from: streams, columns: [id, selected, cursor_age] }
    controls:
      - { kind: brief, id: source-ingest }
      - { kind: nav, rel: config_ref }
      - { kind: focus }
    scene: { shape: crystal, emphasis: sync }
    can_anchor_blocks: true
    identity: { landmark: crystal_spire, motif: streams, ambient: drift, horizon_label: title }
    subpages:
      - { rel: config_ref, page_type: source_config, slug: "{page_id}-config", required: false }
    blocks:
      - { id: wiki.block.source_recipe.v1, scope: self }
      - { id: wiki.block.privacy_boundary.v1, scope: self }
      - { id: wiki.block.ui_intake.v1, config: { forms: [source_sync, recipe_export_checklist] } }
      - { id: wiki.block.ui_missions.v1, config: { providers: [source_cursor_overdue, source_closure] } }
      - { id: wiki.block.ui_create.v1, config: { catalog: [], disabled_reason: create.sourceContentByIngestion } }
    skills:
      human: [skill-human-export-source]
      agent: [skill-agent-ingest-source, skill-agent-deep-read]
  source_config:
    extends: relation_base
    body_template: docs/references/templates/wiki/source-config.md
    pinned_fields: [platform, owner]
    view: { center: entity, badges: [privacy] }
    scene: { shape: crystal, emphasis: practice }
    creatable: false # born WITH its source (subpage contract), never alone
  input_channel:
    extends: relation_base
    body_template: docs/references/templates/wiki/input-channel.md
    scene: { shape: crystal, emphasis: practice }
  ingestion_event:
    extends: relation_base
    body_template: docs/references/templates/wiki/ingestion-event.md
    view: { center: timeline, badges: [freshness] }
    scene: { shape: spark, emphasis: practice }
    creatable: false # born by ingestion runs, never by hand

  # --- Culture/relations-leaning ---------------------------------------------
  person:
    extends: relation_base
    body_template: docs/references/templates/wiki/person.md
    pinned_fields: [updated_at, roles]
    facets:
      relacoes: [roles, related_holons, meetings]
      intencao: [responsibilities]
      pratica: [actions]
    view:
      center: entity
      badges: [freshness]
      panels:
        - { kind: list, from: roles, label: reader.roles }
    scene: { shape: sphere, emphasis: relations }
  role:
    extends: relation_base
    body_template: docs/references/templates/wiki/role.md
    scene: { shape: sphere, emphasis: relations }
  meeting:
    extends: relation_base
    body_template: docs/references/templates/wiki/meeting.md
    pinned_fields: [updated_at, participants, decisions]
    facets:
      intencao: [decisions]
      pratica: [actions, evidence_refs]
      relacoes: [participants, roles]
    view:
      center: timeline
      badges: [freshness]
      panels:
        - { kind: list, from: decisions, label: reader.decisions }
        - { kind: table, from: participants, columns: [title, role] }
    controls:
      - { kind: brief, id: meeting-followup }
      - { kind: focus }
    scene: { shape: slab, emphasis: relations }
  holon:
    extends: relation_base
    body_template: docs/references/templates/wiki/holon.md
    view: { center: dashboard, badges: [freshness] }
    scene: { shape: hub, emphasis: relations }
    can_anchor_blocks: true
    identity: { landmark: plaza, motif: grid, ambient: none, horizon_label: title }
    blocks:
      - { id: wiki.block.quadrants.v1, scope: descendants }
      - { id: wiki.block.relations.v1, scope: descendants }
      - { id: wiki.block.ui_views.v1, config: { default: quadrants } }
      - { id: wiki.block.ui_missions.v1, config: { providers: [stale, meeting_followup, quadrant_absence] } }
      - { id: wiki.block.ui_create.v1, config: { catalog: [meeting, decision, action, person, role], arrangement: by_quadrant } }
    skills: { agent: [skill-agent-classify-quadrants] }
  relationship_map:
    extends: relation_base
    body_template: docs/references/templates/wiki/relationship-map.md
    view: { center: dashboard, badges: [freshness] }
    scene: { shape: hub, emphasis: relations }
    creatable: false # maintained by the relations module, not seeded by hand

  # --- Structural / index (navigation, not a lens) ---------------------------
  root_entity:
    body_template: docs/references/templates/wiki/root-entity.md
    pinned_fields: [updated_at]
    view: { center: dashboard, badges: [freshness] }
    controls: [{ kind: focus }]
    scene: { shape: hub, emphasis: none }
    # A world has ONE root and it is born through the founding rite (setup),
    # never from the generic create palette.
    creatable: false
    # v2: the root is an anchor and brings the LAWS + the basic instruments:
    # privacy, the PR gate, views, create and intake. The INTERPRETATION lenses
    # (quadrants/relations) and the GAMIFICATION package are explicit choices
    # attached on the root PAGE (frontmatter `blocks:`/`packages:`) — this is
    # what the genesis tutorial demonstrates: templates ADD interface. The kit's
    # own root attaches them; downstream wikis choose (migration suggests).
    can_anchor_blocks: true
    identity: { landmark: observatory, motif: rings, ambient: motes, horizon_label: title }
    subpages:
      - { rel: input_stage_ref, page_type: input_stage, generated: true }
      - { rel: operation_ref, page_type: dashboard, slug: operacao, required: false }
    blocks:
      - { id: wiki.block.privacy_boundary.v1, scope: descendants }
      - { id: wiki.block.git_human_gate.v1, scope: descendants }
      - { id: wiki.block.ui_views.v1 }
      - { id: wiki.block.ui_create.v1, config: { catalog: [context_note, source, person, project, holon, decision, tool], obligations_first: true } }
      - { id: wiki.block.ui_intake.v1, config: { forms: [copy_file, paste_text] } }
    skills:
      agent: [skill-agent-conform-template, skill-agent-deep-read]
      human: [skill-human-review-privacy]
  context_hub:
    body_template: docs/references/templates/wiki/context-hub.md
    pinned_fields: [updated_at]
    view: { center: dashboard, badges: [freshness] }
    controls: [{ kind: focus }]
    scene: { shape: hub, emphasis: none }
    can_anchor_blocks: true
    identity: { landmark: beacon, motif: rings, ambient: none, horizon_label: context }
    blocks:
      - { id: wiki.block.ui_missions.v1, config: { providers: [stale, template_conformity] } }
      - { id: wiki.block.ui_create.v1, config: { arrangement: by_family } }
      - { id: wiki.block.ui_intake.v1, config: { forms: [copy_file, paste_text] } }
      - { id: wiki.block.gamification.v1, config: { loops: [context_vitality] } }
  context_note:
    pinned_fields: [updated_at]
    view: { center: document, badges: [freshness] }
    scene: { shape: sphere, emphasis: none }
  # --- Capabilities / meta ----------------------------------------------------
  tool:
    extends: relation_base
    body_template: docs/references/templates/wiki/tool.md
    scene: { shape: crystal, emphasis: practice }
    home_quadrant: sistemas
  skill:
    extends: relation_base
    body_template: docs/references/templates/wiki/skill.md
    scene: { shape: spark, emphasis: practice }
    home_quadrant: sistemas
  template_block:
    body_template: docs/references/templates/wiki/template-block.md
    view: { center: document, badges: [] }
    scene: { shape: slab, emphasis: none }
    home_quadrant: sistemas
    can_anchor_blocks: true
    creatable: false # blueprint pages are authored via the blocks surface, not seeded

  # Generated/system pages (template: none in the validation contract): the
  # system writes them; a human never seeds one from the palette.
  ontology_index:
    view: { center: dashboard, badges: [] }
    scene: { shape: hub, emphasis: none }
    creatable: false
  source_registry:
    view: { center: dashboard, badges: [] }
    scene: { shape: hub, emphasis: none }
    creatable: false
  source_catalog:
    view: { center: dashboard, badges: [] }
    scene: { shape: hub, emphasis: none }
    creatable: false
  input_stage:
    view: { center: dashboard, badges: [] }
    scene: { shape: hub, emphasis: none }
    creatable: false
  system_log:
    view: { center: timeline, badges: [] }
    scene: { shape: slab, emphasis: none }
    creatable: false
