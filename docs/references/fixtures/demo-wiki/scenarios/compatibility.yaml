      - "apps/wiki-cockpit/src/router.test.ts::aliases /ops to the default (quadrants) world and keeps /pages/:id as a redirectable alias"
      - "apps/wiki-cockpit/src/world/WorldRuntime.test.ts::normalizes legacy route state and writes the canonical grammar"
    covers:
      interactions: [hydrate_legacy_route, open_old_snapshot]
      visual_steps: [open_each_legacy_route, compare_canonical_state]
      visual_viewports: [1440x960, 390x844]
      browser_projects: [chromium-desktop, webkit-mobile, chromium-fallback, firefox-smoke]
      expected_warnings: [legacy_route_normalized]
      expected_failures: []
  - claim_id: canonical_writers_never_emit_legacy_state
    statement: Canonical link writers emit query-owned /w?view state; positional routes remain read-only compatibility inputs.
    test_ids:
      - "apps/wiki-cockpit/src/router.test.ts::round-trips URLs through buildUrl using only the canonical query-owned grammar"
      - "apps/wiki-cockpit/src/router.test.ts::keeps positional routes as readable inputs but normalizes every writer back to /w?view"
    covers:
      interactions: [copy_canonical_link]
      visual_steps: []
      visual_viewports: []
      browser_projects: []
      expected_warnings: []
      expected_failures: []
