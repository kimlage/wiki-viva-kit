schema_version: wiki_viva_sync_manifest.v1

# The portable, kit-owned contract. Git-tracked regular files only; block wins.
portable:
  allow:
    - wiki_core/**
    - scripts/wiki_*.py
    - scripts/_common.py
    - scripts/README.md
    - apps/wiki-cockpit/**
    - .skills/wiki-*/**
    - packs/**
    - docs/references/guides/**
    - docs/references/releases/hermes-integration-withdrawal-2026-10-22.md
    - docs/references/templates/deploy/**
    - docs/references/templates/wiki/subagent-brief.md
    - docs/references/schemas/**
  block:
    - apps/wiki-cockpit/e2e/**
    - apps/wiki-cockpit/scripts/demo-journeys.test.mjs
    - apps/wiki-cockpit/playwright.config.ts
    - apps/wiki-cockpit/public/sample-snapshot/**
    - scripts/wiki_build_demo.py
    - apps/wiki-cockpit/node_modules/**
    - data/**
    - memories/**
    - memorias/**
    - .wiki-viva/**
    - wiki.config.yaml
    - wiki.packs.lock.yaml
    - wiki.templates.yaml
    - wiki.page-types.yaml
    - docs/references/upgrades/**

# C2 is deterministic and kit-owned. C3 is always explicit on the CLI because
# adapters, configuration and domain content belong to the consumer.
c2_commands: []
