schema_version: wiki_viva_upgrade_package.v2

release:
  id: wiki-viva-v8-rc15
  status: validation_pending
  source_sha: f9defa5a0f156816fe419df6c8f208b9eea138e0
  plan: docs/references/proposals/wiki-viva-release-truth-temporal-world-experience-packs-plan-2026-07-11.md
  pull_request: https://github.com/kimlage/wiki-viva-kit/pull/61

historical_release_candidates:
  - id: wiki-viva-v8-rc14
    source_sha: 45e7cd90aada3ff847ded4570dbe921ab69f11c5
    status: historical_release_candidate
    note: S16 fixed result-window reset visibility and passed 513 frontend checks plus build, but independent release review found that validation_pending falsely hid an available source tree and its real downstream drift; S18 preserves those diagnostics while keeping promotion blocked
  - id: wiki-viva-v8-rc13
    source_sha: ffaec5dc263cf1e4baef8743015d1c8ea67f44b2
    status: historical_release_candidate
    note: S14 made result-window selection coherent and machine-blocked private adoption, but review found a false-green E2E locator and a reset-scroll race; the corrected test-only intermediate and final visibility fix advance together to rc14
  - id: wiki-viva-v8-rc12
    source_sha: 3fed97fa52fa1efd27d651cbd97c3ab67a4f5cfa
    status: historical_release_candidate
    note: S13 fixed stale mixed-pointer and keyboard selection, but restricted exact-subject gates could not bind sockets or browsers and review then found result-window ARIA coherence and keyboard visibility gaps; rc12 remains negative evidence, not an import authority
  - id: wiki-viva-v8-rc11
    source_sha: e0a456097850865a98a5d728e8161ffd7159a3a9
    status: historical_release_candidate
    note: S12 passed 1,372 Python, 512 frontend and 107 Node checks, but its only public browser run closed 101/102; the retained failure exposed stale mixed-pointer/keyboard search selection and rc12 fixes that product state without retrying rc11
  - id: wiki-viva-v8-rc10
    source_sha: 83a98e5a7c79babfcfa4b0326e663cfd6e4477f6
    status: historical_release_candidate
    note: S11 closes real-data semantic parity and deep migration profiles; its first public browser run exposed a hydration-readiness race in one persistence assertion, retained as blocked evidence and fixed without weakening the assertion
  - id: wiki-viva-v8-rc9
    source_sha: 2bf99150b2e1a5a305743144e10a9a939b4e01e1
    status: historical_release_candidate
    note: exact S10 post-S9 closure payload; real private pressure subsequently exposed legacy graph parity and package-owned visual-profile gaps, so rc9 remains evidence rather than the adoption target
  - id: wiki-viva-v8-rc8
    source_sha: b45378d37e96eed04fb355392d10bd8471c5fda7
    status: historical_release_candidate
    note: exact S9 mobile-control payload and paired downstream pilot; retained with its own evidence and never promoted as post-S9 proof
  - id: wiki-viva-v8-rc4
    source_sha: f7c9d0ad837b303e388b3b1c1dbaaeff9df3b1bb
    status: historical_release_candidate
    note: exact S4 parser and same-turn live-to-demo boundary closure; retained with its original evidence and never rewritten as rc8 proof
  - id: wiki-viva-v8-rc5
    source_sha: b852a992afa3eae64e220c461c2eff052572377c
    status: historical_release_candidate
    note: exact S6 request-time live-to-demo observer closure with its own Python and browser evidence
  - id: wiki-viva-v8-rc6
    source_sha: fa83a70500b3b1d27074c54e70893405d61d9b87
    status: historical_release_candidate
    note: S7 aligns downstream pages integrity and canonical temporal migration vocabulary with the actual snapshot contracts
  - id: wiki-viva-v8-rc7
    source_sha: d0a6168cf8aa291d79047c28a0c61eb274b973f9
    status: historical_release_candidate
    note: exact S8 rendered-UI observer consumes the atomic snapshot boot envelope and retains its own public and downstream browser receipts

contract_versions:
  route: wiki_world_route.v8
  snapshot: wiki_web_snapshot.v2
  snapshot_envelope: wiki_web_snapshot.v2
  blocks: wiki_templates.v2+wiki_web_block_stacks.v1
  visual_grammar: wiki_visual_grammar.v8
  semantic_visual_tokens: wiki_semantic_visual_tokens.v1
  appearance: wiki_cockpit_appearance.v1
  runtime: wiki_world_runtime.v8
  source_lifecycle: wiki_source_lifecycle.v2
  freshness: wiki_web_freshness.v1
  server: wiki_web_server.v6
  activity_timeline: activity_timeline.v1
  temporal_event: wiki_temporal_event.v1
  temporal_graph: wiki_temporal_graph.v1
  experience_pack: wiki_experience_pack.v1
  experience_pack_registry: wiki_experience_pack_registry.v1
  experience_pack_lock: wiki_experience_pack_lock.v1
  experience_pack_composition: wiki_experience_pack_composition.v1
  asset_manifest: wiki_cockpit_asset_manifest.v1
  downstream_adapter_manifest: wiki_downstream_adapter_manifest.v1

portable_import:
  # Block rules win over allow rules. Paths are always repository-relative.
  allow:
    - wiki_core/**
    - scripts/wiki_*.py
    - scripts/_git_subject.py
    - apps/wiki-cockpit/**
    - .skills/wiki-*/**
    - packs/**
    - scripts/README.md
    - docs/references/guides/**
    - docs/references/templates/deploy/**
    - docs/references/schemas/**
    - docs/references/fixtures/demo-wiki/**
  block:
    - memories/**
    - memorias/**
    - wiki.config.yaml
    - wiki.targets.yaml
    - wiki.templates.local.yaml
    - wiki.page-types.local.yaml
    - wiki.packs.lock.yaml
    - wiki.adapter-manifest.json
    - .wiki-viva/**
    - docs/references/releases/wiki-viva-v8.md
    - docs/references/upgrades/wiki-viva-v8/**
    - .github/workflows/**
    - tests/**
    - requirements.txt
    - wiki.page-types.yaml
    - wiki.templates.yaml
    - apps/wiki-cockpit/public/wiki-cockpit.config.json
    - apps/wiki-cockpit/tmp/**
    - data/raw/**
    - data/derived/**
    - private/**
    - output/**
    - test-results/**
    - "**/dist/**"
    - "**/coverage/**"
    - "**/test-results/**"
    - "**/playwright-report/**"
    - "**/.playwright-cli/**"
    - "**/*.tsbuildinfo"
    - "**/*.log"
    - "**/.DS_Store"
    - .env
    - .env.*
    - "**/.env"
    - "**/.env.*"
    - "**/*private-snapshot*"
    - "**/*credentials*"
    - "**/*secrets*"

preflight:
  branch_prefix: wiki/
  required_gates:
    - toolkit_drift
    - audit
    - input_stage
    - semantic_inventory
    - pytest
    - diff_check
  # A bounded semantic debt may be repaired only in the declared third
  # downstream boundary. Audit, pytest, privacy and diff remain pass-only, and
  # the final migration report still requires semantic_inventory=pass.
  reviewable_gates:
    semantic_inventory:
      required_boundary: downstream_adaptations
      max_findings: 64

migration:
  commit_boundaries:
    - faithful_public_import
    - regenerated_artifacts
    - downstream_adaptations
  required_gates:
    - toolkit_drift
    - audit
    - public_evidence_redaction
    - methodology_coverage
    - operation_compile
    - input_stage
    - semantic_inventory
    - pytest
    - frontend
    - node_gates
    - snapshot_contract
    - pack_validation
    - architecture
    - assets
    - bundle
    - release_matrix_inventory
    - browser_required
    - demo_drift
    - diff_check
  visual_profiles:
    - desktop
    - mobile
    - fallback
    - quadrant_collection_two_step

runtime_policy:
  rollout_modes:
    - legacy
    - compat
    - v8
  initial_downstream_mode: compat
  rollback_first: switch_to_compat_or_legacy
  rollback_second: revert_reviewable_commits
  flags_must_not_weaken:
    - route_grammar
    - secret_scanning
    - public_private_boundary
    - sample_fallback_blocking
    - compatibility_view_identity
    - adaptive_performance_fallback

compatibility:
  - surface: legacy_districts_route
    v8_behavior: preserve_explicit_compat_identity_without_false_native_selection
    warning_becomes_error: evidence_based_future_release_only
    removal_target: no_removal_without_accepted_native_replacement
  - surface: legacy_trails_route
    v8_behavior: preserve_explicit_compat_identity_around_real_center
    warning_becomes_error: evidence_based_future_release_only
    removal_target: no_removal_without_accepted_native_relations_geometry
  - surface: legacy_cockpit_routes
    v8_behavior: read_and_normalize_to_canonical_route_state
    warning_becomes_error: v9_release_candidate
    removal_target: v9_stable_unless_reports_show_blockers
  - surface: previous_snapshot_version
    v8_behavior: load_previous_supported_version_with_warning_and_migrator
    warning_becomes_error: after_one_release_cycle
    removal_target: two_release_cycles_after_v8
  - surface: legacy_block_vocabulary_aliases
    v8_behavior: read_with_warning_and_emit_canonical_blocks
    warning_becomes_error: v9_release_candidate
    removal_target: v9_stable
  - surface: legacy_quadrant_query
    v8_behavior: read_as_lens_alias_with_lens_precedence
    warning_becomes_error: v9_release_candidate
    removal_target: v9_stable
  - surface: legacy_local_dock_wiring
    v8_behavior: allowed_only_in_compat_mode
    warning_becomes_error: after_v8_warning_cycle
    removal_target: v9_stable

privacy:
  default_public_report: redacted
  never_publish:
    - private_page_titles
    - personal_or_financial_values
    - authenticated_urls
    - raw_source_content
    - secrets_or_credentials
    - private_console_or_network_payloads

known_limitations:
  - The package identifies exact post-S9 public payload S18 but deliberately keeps status validation_pending; package_is_pinned and downstream preflight must fail until the complete deterministic/frontend/Node/browser gate stack plus current visual QA exist on the pinned source.
  - Browser-closure evidence is scoped to browser behavior; it is not a full-release or externally signed E5 attestation.
  - Exact S10 passed 1,367 Python, 512 frontend, 107 Node and 102/102 first-attempt public browser cells; those counts remain historical and are not relabeled as S11 proof.
  - Exact S12 passed 1,372 Python, 512 frontend and 107 Node checks, then its single public browser run blocked at 101/102 with zero retry; that negative evidence remains attached to rc11 and is not relabeled as S13 proof.
  - The private pilot's exact S9 import and 2/2 downstream result are historical pressure evidence only; exact S18 may be imported in three new ordered reviewable boundaries only after public validation changes this package to a releasable status.
  - The historical private S9 read-only preflight remains attached to S9; S18 requires a new subject-bound preflight, migration report, rollback execution and redacted projection while raw evidence stays private.
  - Real legacy-event equality and compatibility inventory, real-data search acceptance, the canonical migration report, downstream relation inventory, source authoring replay and restart/security documentation replay remain consumer-semantic promotion gates (RT-09/10/29/33/36/47/48).
  - Manual private 390x844 inspection observed five view controls with clientWidth equal to scrollWidth at 62 px, zero inner-label and document overflow, 44 px minimum height and hidden mobile icons; the exact public S9 wrapper independently repeated and closed RT-144.
  - The runtime operation lock at .wiki-viva/pack-operation.lock is not yet covered by a portable ignore contract; RT-141 tracks this non-blocking P2 hygiene improvement.
  - An expected client disconnect during a large atomic boot write can emit BrokenPipeError or ConnectionResetError tracebacks; RT-145 tracks a narrow write/flush guard and aborted-client regression without masking serialization or unexpected server errors.
  - Causal self/cycle/time-direction validation and full-graph attestation for future paginated temporal APIs remain explicit P2 follow-ups.
  - CI workflows are consumer-owned deployment policy and are intentionally excluded from portable import; downstreams must keep their own gates at least as strict.
  - Dependency and base page-type/template registries are consumer-owned merge surfaces in this release; downstreams must preserve local extensions, add every new public minimum dependency/contract and prove the merged result through audit, snapshot, pack and full test gates.
  - Downstream test suites are consumer-owned integration policy and are not copied by the portable importer; the current public subject still requires its exact full validation before promotion, and each consumer must then run its own real-data and adapter tests.
  - Consumer-specific core failures must first become synthetic public fixtures.
