schema_version: wiki_viva_upgrade_package.v2

release:
  id: wiki-viva-v8-rc2
  status: release_candidate
  source_sha: b781882a11e8bbac3ae9684d199979a1f4ee1bf7
  plan: docs/references/proposals/wiki-viva-release-truth-temporal-world-experience-packs-plan-2026-07-11.md
  pull_request: https://github.com/kimlage/wiki-viva-kit/pull/61

contract_versions:
  route: wiki_world_route.v8
  snapshot: wiki_web_snapshot.v2
  snapshot_envelope: wiki_web_snapshot.v2
  blocks: wiki_templates.v2+wiki_web_block_stacks.v1
  visual_grammar: wiki_visual_grammar.v8
  semantic_visual_tokens: wiki_semantic_visual_tokens.v1
  appearance: wiki_cockpit_appearance.v1
  runtime: wiki_world_runtime.v8
  source_lifecycle: wiki_source_lifecycle.v2
  freshness: wiki_web_freshness.v1
  server: wiki_web_server.v6
  activity_timeline: activity_timeline.v1
  temporal_event: wiki_temporal_event.v1
  temporal_graph: wiki_temporal_graph.v1
  experience_pack: wiki_experience_pack.v1
  experience_pack_registry: wiki_experience_pack_registry.v1
  experience_pack_lock: wiki_experience_pack_lock.v1
  experience_pack_composition: wiki_experience_pack_composition.v1
  asset_manifest: wiki_cockpit_asset_manifest.v1
  downstream_adapter_manifest: wiki_downstream_adapter_manifest.v1

portable_import:
  # Block rules win over allow rules. Paths are always repository-relative.
  allow:
    - wiki_core/**
    - scripts/wiki_*.py
    - scripts/_git_subject.py
    - tests/**
    - apps/wiki-cockpit/**
    - .skills/wiki-*/**
    - packs/**
    - docs/references/guides/**
    - docs/references/schemas/**
    - docs/references/fixtures/demo-wiki/**
    - wiki.page-types.yaml
    - wiki.templates.yaml
    - requirements.txt
  block:
    - memories/**
    - memorias/**
    - wiki.config.yaml
    - wiki.targets.yaml
    - wiki.templates.local.yaml
    - wiki.page-types.local.yaml
    - wiki.packs.lock.yaml
    - wiki.adapter-manifest.json
    - .wiki-viva/**
    - docs/references/releases/wiki-viva-v8.md
    - docs/references/upgrades/wiki-viva-v8/**
    - .github/workflows/**
    - apps/wiki-cockpit/public/wiki-cockpit.config.json
    - apps/wiki-cockpit/tmp/**
    - data/raw/**
    - data/derived/**
    - private/**
    - output/**
    - test-results/**
    - "**/dist/**"
    - "**/coverage/**"
    - "**/test-results/**"
    - "**/playwright-report/**"
    - "**/.playwright-cli/**"
    - "**/*.tsbuildinfo"
    - "**/*.log"
    - "**/.DS_Store"
    - .env
    - .env.*
    - "**/.env"
    - "**/.env.*"
    - "**/*private-snapshot*"
    - "**/*credentials*"
    - "**/*secrets*"

preflight:
  branch_prefix: wiki/
  required_gates:
    - toolkit_drift
    - audit
    - public_export_audit
    - input_stage
    - pytest
    - diff_check

migration:
  commit_boundaries:
    - faithful_public_import
    - regenerated_artifacts
    - downstream_adaptations
  required_gates:
    - toolkit_drift
    - audit
    - public_export_audit
    - methodology_coverage
    - operation_compile
    - input_stage
    - pytest
    - frontend
    - node_gates
    - snapshot_contract
    - pack_validation
    - architecture
    - assets
    - bundle
    - release_matrix_inventory
    - browser_required
    - demo_drift
    - diff_check
  visual_profiles:
    - desktop
    - mobile
    - fallback
    - quadrant_collection_two_step

runtime_policy:
  rollout_modes:
    - legacy
    - compat
    - v8
  initial_downstream_mode: compat
  rollback_first: switch_to_compat_or_legacy
  rollback_second: revert_reviewable_commits
  flags_must_not_weaken:
    - route_grammar
    - secret_scanning
    - public_private_boundary
    - sample_fallback_blocking
    - compatibility_view_identity
    - adaptive_performance_fallback

compatibility:
  - surface: legacy_districts_route
    v8_behavior: preserve_explicit_compat_identity_without_false_native_selection
    warning_becomes_error: evidence_based_future_release_only
    removal_target: no_removal_without_accepted_native_replacement
  - surface: legacy_trails_route
    v8_behavior: preserve_explicit_compat_identity_around_real_center
    warning_becomes_error: evidence_based_future_release_only
    removal_target: no_removal_without_accepted_native_relations_geometry
  - surface: legacy_cockpit_routes
    v8_behavior: read_and_normalize_to_canonical_route_state
    warning_becomes_error: v9_release_candidate
    removal_target: v9_stable_unless_reports_show_blockers
  - surface: previous_snapshot_version
    v8_behavior: load_previous_supported_version_with_warning_and_migrator
    warning_becomes_error: after_one_release_cycle
    removal_target: two_release_cycles_after_v8
  - surface: legacy_block_vocabulary_aliases
    v8_behavior: read_with_warning_and_emit_canonical_blocks
    warning_becomes_error: v9_release_candidate
    removal_target: v9_stable
  - surface: legacy_quadrant_query
    v8_behavior: read_as_lens_alias_with_lens_precedence
    warning_becomes_error: v9_release_candidate
    removal_target: v9_stable
  - surface: legacy_local_dock_wiring
    v8_behavior: allowed_only_in_compat_mode
    warning_becomes_error: after_v8_warning_cycle
    removal_target: v9_stable

privacy:
  default_public_report: redacted
  never_publish:
    - private_page_titles
    - personal_or_financial_values
    - authenticated_urls
    - raw_source_content
    - secrets_or_credentials
    - private_console_or_network_payloads

known_limitations:
  - The payload is pinned to the exact public browser-closure subject, but PR 61 still requires human review, merge and a release tag.
  - Browser-closure evidence is scoped to browser behavior; it is not a full-release or externally signed E5 attestation.
  - The private pilot must import this exact payload in three reviewable boundaries and repeat the real-data operator, Chronoscope, pack, theme, mobile and fallback matrix before adoption can be claimed.
  - Causal self/cycle/time-direction validation and full-graph attestation for future paginated temporal APIs remain explicit P2 follow-ups.
  - CI workflows are consumer-owned deployment policy and are intentionally excluded from portable import; downstreams must keep their own gates at least as strict.
  - Consumer-specific core failures must first become synthetic public fixtures.
