portable_import:
  # Block rules win over allow rules. Paths are always repository-relative.
  allow:
    - wiki_core/**
    - scripts/wiki_*.py
    - scripts/_git_subject.py
    - apps/wiki-cockpit/**
    - .skills/wiki-*/**
    - packs/**
    - scripts/README.md
    - docs/references/guides/**
    - docs/references/templates/deploy/**
    - docs/references/schemas/**
    - docs/references/fixtures/demo-wiki/**
  block:
    - memories/**
    - memorias/**
    - wiki.config.yaml
    - wiki.targets.yaml
    - wiki.templates.local.yaml
    - wiki.page-types.local.yaml
    - wiki.packs.lock.yaml
    - wiki.adapter-manifest.json
    - .wiki-viva/**
    - docs/references/releases/wiki-viva-v8.md
    - docs/references/upgrades/wiki-viva-v8/**
    - .github/workflows/**
    - tests/**
    - requirements.txt
    - wiki.page-types.yaml
    - wiki.templates.yaml
    - apps/wiki-cockpit/public/wiki-cockpit.config.json
    - apps/wiki-cockpit/tmp/**
    - data/raw/**
    - data/derived/**
    - private/**
    - output/**
    - test-results/**
    - "**/dist/**"
    - "**/coverage/**"
    - "**/test-results/**"
    - "**/playwright-report/**"
    - "**/.playwright-cli/**"
    - "**/*.tsbuildinfo"
    - "**/*.log"
    - "**/.DS_Store"
    - .env
    - .env.*
    - "**/.env"
    - "**/.env.*"
    - "**/*private-snapshot*"
    - "**/*credentials*"
    - "**/*secrets*"

preflight:
  branch_prefix: wiki/
  required_gates:
    - toolkit_drift
    - audit
    - input_stage
    - pytest
    - diff_check
  # The baseline consumer does not yet carry the v8 semantic-inventory CLI.
  # Semantic inventory remains mandatory and pass-only after the faithful
  # import, inside the complete migration gate matrix below.

migration:
  commit_boundaries:
    - faithful_public_import
    - regenerated_artifacts
    - downstream_adaptations
  # Exact surfaces the regenerated_artifacts boundary may rewrite. Anything
  # outside these globs must arrive via faithful_public_import or the declared
  # downstream_adaptations boundary.
  generated_artifact_patterns:
    - apps/wiki-cockpit/public/sample-snapshot/**
    - docs/references/fixtures/demo-wiki/memories/**
    - apps/wiki-cockpit/e2e/__screenshots__/**
  required_gates:
    - toolkit_drift
    - audit
    - public_evidence_redaction
    - methodology_coverage
    - quality_report
    - operation_compile
    - source_registry
    - input_stage
    - semantic_inventory
    - pytest
    - frontend
    - build
    - node_gates
    - snapshot_contract
    - pack_validation
    - architecture
    - assets
    - bundle
    - release_matrix_inventory
    - browser_required
    - demo_drift
    - diff_check
  # Transitional v2 registry: every entry remains blocking. WIKI_VIVA_KIT_ROOT
  # points at this metadata authority commit; WIKI_VIVA_PYTHON is the verified
  # consumer interpreter. No v3 gate class or receipt can waive these commands.
  gate_commands:
    toolkit_drift: '"$WIKI_VIVA_PYTHON" scripts/wiki_toolkit_drift.py --ref-path "$WIKI_VIVA_KIT_ROOT" --check'
    audit: '"$WIKI_VIVA_PYTHON" scripts/wiki_audit.py --check'
    public_evidence_redaction: '"$WIKI_VIVA_PYTHON" -m pytest tests/test_upgrade.py -k "public_migration"'
    methodology_coverage: '"$WIKI_VIVA_PYTHON" scripts/wiki_check_methodology_coverage.py --check'
    quality_report: '"$WIKI_VIVA_PYTHON" scripts/wiki_quality_report.py --check'
    operation_compile: '"$WIKI_VIVA_PYTHON" scripts/wiki_operation_compile.py --check'
    source_registry: '"$WIKI_VIVA_PYTHON" private/scripts/wiki_source_registry.py --check'
    input_stage: '"$WIKI_VIVA_PYTHON" scripts/wiki_input_stage.py --check'
    semantic_inventory: '"$WIKI_VIVA_PYTHON" scripts/wiki_semantic_inventory.py --check'
    pytest: '"$WIKI_VIVA_PYTHON" -m pytest tests/'
    frontend: npm --prefix apps/wiki-cockpit test
    build: npm --prefix apps/wiki-cockpit run build
    node_gates: npm --prefix apps/wiki-cockpit run test:gates
    snapshot_contract: '"$WIKI_VIVA_PYTHON" scripts/wiki_web_snapshot.py --check-contract'
    pack_validation: '"$WIKI_VIVA_PYTHON" scripts/wiki_pack.py validate --all'
    architecture: npm --prefix apps/wiki-cockpit run check:architecture
    assets: npm --prefix apps/wiki-cockpit run check:assets
    bundle: npm --prefix apps/wiki-cockpit run check:bundle
    release_matrix_inventory: npm --prefix apps/wiki-cockpit run check:release-matrix
    browser_required: npm --prefix apps/wiki-cockpit run test:e2e:release
    demo_drift: '"$WIKI_VIVA_PYTHON" scripts/wiki_build_demo.py --check'
    diff_check: git diff --check
  visual_profiles:
    - desktop
    - mobile
    - fallback
    - quadrant_collection_two_step

runtime_policy:
  rollout_modes:
    - legacy
    - compat
    - v8
  initial_downstream_mode: compat
  rollback_first: switch_to_compat_or_legacy
  rollback_second: revert_reviewable_commits
  flags_must_not_weaken:
    - route_grammar
    - secret_scanning
    - public_private_boundary
    - sample_fallback_blocking
    - compatibility_view_identity
    - adaptive_performance_fallback

compatibility:
  - surface: legacy_districts_route
    v8_behavior: preserve_explicit_compat_identity_without_false_native_selection
    warning_becomes_error: evidence_based_future_release_only
    removal_target: no_removal_without_accepted_native_replacement
  - surface: legacy_trails_route
    v8_behavior: preserve_explicit_compat_identity_around_real_center
    warning_becomes_error: evidence_based_future_release_only
    removal_target: no_removal_without_accepted_native_relations_geometry
  - surface: legacy_cockpit_routes
    v8_behavior: read_and_normalize_to_canonical_route_state
    warning_becomes_error: v9_release_candidate
    removal_target: v9_stable_unless_reports_show_blockers
  - surface: previous_snapshot_version
    v8_behavior: load_previous_supported_version_with_warning_and_migrator
    warning_becomes_error: after_one_release_cycle
    removal_target: two_release_cycles_after_v8
  - surface: legacy_block_vocabulary_aliases
    v8_behavior: read_with_warning_and_emit_canonical_blocks
    warning_becomes_error: v9_release_candidate
    removal_target: v9_stable
  - surface: legacy_quadrant_query
    v8_behavior: read_as_lens_alias_with_lens_precedence
    warning_becomes_error: v9_release_candidate
    removal_target: v9_stable
  - surface: legacy_local_dock_wiring
    v8_behavior: allowed_only_in_compat_mode
    warning_becomes_error: after_v8_warning_cycle
    removal_target: v9_stable

privacy:
  default_public_report: redacted
  never_publish:
    - private_page_titles
    - personal_or_financial_values
    - authenticated_urls
    - raw_source_content
    - private_screenshots
    - raw_private_visual_pixels
    - secrets_or_credentials
    - private_console_or_network_payloads

known_limitations:
  - The private-first candidate binds exact local source 6e9aeb2d96f79324ee65b2064e645aae35ac0a29. That clean source passed 516 frontend tests, 115 Node gate tests and 102/102 first-attempt browser cells on Node 22, with zero skip and zero retry. It was not pushed, published or represented as a public release; this metadata-only package exists solely for the authorized private downstream acceptance.
  - Browser-closure evidence is scoped to browser behavior; it is not a full-release or externally signed E5 attestation.
  - Exact S10 passed 1,367 Python, 512 frontend, 107 Node and 102/102 first-attempt public browser cells; those counts remain historical and are not relabeled as S11 proof.
  - Exact S12 passed 1,372 Python, 512 frontend and 107 Node checks, then its single public browser run blocked at 101/102 with zero retry; that negative evidence remains attached to rc11 and is not relabeled as S13 proof.
  - The private pilot's exact S9 import and 2/2 downstream result are historical pressure evidence only. The owner explicitly authorized this newer local payload to run first in the private main path through three ordered reviewable boundaries; that exception does not authorize public promotion or publication.
  - The historical private S9 read-only preflight remains attached to S9; S22 requires a new subject-bound preflight, migration report, rollback execution and redacted projection while raw evidence stays private.
  - Real legacy-event equality and compatibility inventory, real-data search acceptance, the canonical migration report, downstream relation inventory, source authoring replay and restart/security documentation replay remain consumer-semantic promotion gates (RT-09/10/29/33/36/47/48).
  - Manual private 390x844 inspection observed five view controls with clientWidth equal to scrollWidth at 62 px, zero inner-label and document overflow, 44 px minimum height and hidden mobile icons; the exact public S9 wrapper independently repeated and closed RT-144.
  - The runtime operation lock at .wiki-viva/pack-operation.lock is not yet covered by a portable ignore contract; RT-141 tracks this non-blocking P2 hygiene improvement.
  - An expected client disconnect during a large atomic boot write can emit BrokenPipeError or ConnectionResetError tracebacks; RT-145 tracks a narrow write/flush guard and aborted-client regression without masking serialization or unexpected server errors.
  - Causal self/cycle/time-direction validation and full-graph attestation for future paginated temporal APIs remain explicit P2 follow-ups.
  - CI workflows are consumer-owned deployment policy and are intentionally excluded from portable import; downstreams must keep their own gates at least as strict.
  - Dependency and base page-type/template registries are consumer-owned merge surfaces in this release; downstreams must preserve local extensions, add every new public minimum dependency/contract and prove the merged result through audit, snapshot, pack and full test gates.
  - Consumer-owned downstream Python suites under tests/** and workflows are integration policy and are not copied or compared as portable drift; package-owned cockpit tests under apps/wiki-cockpit/** remain portable. This private-first exception still requires the consumer's complete real-data, adapter, browser, report and rollback gates before its human PR gate.
  - Consumer-specific core failures must first become synthetic public fixtures.
