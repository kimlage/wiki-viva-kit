  downstream_adapter_manifest: wiki_downstream_adapter_manifest.v1
  consumer_c3_authority: wiki_viva_upgrade_consumer_c3_authority.v1

portable_import:
  # Block rules win over allow rules. Paths are always repository-relative.
  allow:
    - wiki_core/**
    - scripts/wiki_*.py
    - scripts/_common.py
    - scripts/_git_subject.py
    - apps/wiki-cockpit/**
    - .skills/wiki-*/**
    - packs/**
    - scripts/README.md
    - docs/references/guides/**
    - docs/references/templates/deploy/**
    - docs/references/schemas/**
    - docs/references/fixtures/demo-wiki/**
  block:
    - memories/**
    - memorias/**
    - wiki.config.yaml
    - wiki.targets.yaml
    - wiki.templates.local.yaml
    - wiki.page-types.local.yaml
    - wiki.packs.lock.yaml
    - wiki.adapter-manifest.json
    - .wiki-viva/**
    - docs/references/releases/wiki-viva-v8.md
    - docs/references/upgrades/wiki-viva-v8/**
    - .github/workflows/**
    - tests/**
    - requirements.txt
    - wiki.page-types.yaml
    - wiki.templates.yaml
    - apps/wiki-cockpit/public/wiki-cockpit.config.json
    # C2 is generated from the certified subject, never imported byte-equal as
    # C1. These exact ownership globs must stay blocked even though broader
    # portable allow rules contain them.
    - apps/wiki-cockpit/e2e/__screenshots__/**
    - apps/wiki-cockpit/public/sample-snapshot/**
    - docs/references/fixtures/demo-wiki/memories/**
    - apps/wiki-cockpit/tmp/**
    - data/raw/**
    - data/derived/**
    - private/**
    - output/**
    - test-results/**
    - "**/dist/**"
    - "**/coverage/**"
    - "**/test-results/**"
    - "**/playwright-report/**"
    - "**/.playwright-cli/**"
    - "**/*.tsbuildinfo"
    - "**/*.log"
    - "**/.DS_Store"
    - .env
    - .env.*
    - "**/.env"
    - "**/.env.*"
    - "**/*private-snapshot*"
    - "**/*credentials*"
    - "**/*secrets*"

preflight:
  branch_prefix: wiki/
  required_gates:
    - diff_check
  gate_mapping:
    diff_check: diff_check

migration:
  commit_boundaries:
    - faithful_public_import
    - regenerated_artifacts
    - downstream_adaptations
  # Exact surfaces the regenerated_artifacts boundary may rewrite. Anything
  # outside these globs must arrive via faithful_public_import or the declared
  # downstream_adaptations boundary.
  generated_artifact_patterns:
    - apps/wiki-cockpit/public/sample-snapshot/**
    - docs/references/fixtures/demo-wiki/memories/**
    - apps/wiki-cockpit/e2e/__screenshots__/**
  required_gates:
    - adapter_identity
