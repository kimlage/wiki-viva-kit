# Copy this file into the consumer PR and replace every placeholder with
# evidence from that repository. The public package intentionally does not
# contain real private paths, SHAs, routes or screenshots.
schema_version: wiki_viva_migration_evidence.v2
evidence_context:
  package_sha256: REPLACE_WITH_PACKAGE_SHA256
  validator_version: wiki_viva_upgrade_validator.v3
  captured_consumer_head: REPLACE_WITH_FINAL_MIGRATION_SHA
source:
  release: wiki-viva-v8-rc13
  sha: REPLACE_WITH_PINNED_PUBLIC_SHA
  plan: docs/references/proposals/wiki-viva-release-truth-temporal-world-experience-packs-plan-2026-07-11.md
consumer_before:
  repository: consumer-id
  branch: wiki/upgrade-v8
  head_sha: REPLACE_WITH_PREVIOUS_CONSUMER_SHA
  kit_version: untracked
  gate_status: pass
consumer_after:
  branch: wiki/upgrade-v8
  import_commit_sha: REPLACE_WITH_IMPORT_COMMIT_SHA
  artifact_commit_sha: null
  adaptation_commit_sha: null
omitted_boundaries:
  - boundary: artifact_commit_sha
    reason: No generated artifact commit was required for this consumer.
  - boundary: adaptation_commit_sha
    reason: No consumer-specific adaptation commit was required.
files_imported:
  - wiki_core/upgrade.py
  - scripts/_git_subject.py
  - packs/personal-finance/pack.yaml
  - docs/references/schemas/wiki-temporal-graph-v1.schema.json
local_overrides_kept:
  - wiki.config.yaml
  - wiki.targets.yaml
  - wiki.page-types.yaml
  - wiki.templates.yaml
  - requirements.txt
  - tests/
  - wiki.packs.lock.yaml
  - wiki.adapter-manifest.json
  - wiki.page-types.local.yaml
  - wiki.templates.local.yaml
  - .github/workflows/wiki.yml
  - apps/wiki-cockpit/public/wiki-cockpit.config.json
warnings: []
fixtures_added: []
gates:
  - {id: toolkit_drift, command: "package-aware compare_portable_files against pinned source_sha; require drift_total=0", status: pass}
  - {id: audit, command: "record exact command", status: pass}
  - {id: public_evidence_redaction, command: "python3 scripts/wiki_upgrade_report.py --public-export --check with redacted route/evidence refs", status: pass}
  - {id: methodology_coverage, command: "record exact command", status: pass}
  - {id: operation_compile, command: "record exact command", status: pass}
  - {id: input_stage, command: "record exact command", status: pass}
  - {id: semantic_inventory, command: "python3 scripts/wiki_semantic_inventory.py --check", status: pass}
  - {id: pytest, command: "record exact command", status: pass}
  - {id: frontend, command: "record exact command", status: pass}
  - {id: node_gates, command: "record exact command", status: pass}
  - {id: snapshot_contract, command: "record exact command", status: pass}
  - {id: pack_validation, command: "record exact command", status: pass}
  - {id: architecture, command: "record exact command", status: pass}
  - {id: assets, command: "record exact command", status: pass}
  - {id: bundle, command: "record exact command", status: pass}
  - {id: release_matrix_inventory, command: "record exact command", status: pass}
  - {id: browser_required, command: "record exact command", status: pass}
  - {id: demo_drift, command: "record exact command", status: pass}
  - {id: diff_check, command: "record exact command", status: pass}
visual_qa_evidence:
  - {profile: desktop, route_ref: "route:sha256:REPLACE", center_ref: "center:sha256:REPLACE", viewport: 1440x1000, browser: chromium, screenshot_ref: qa/desktop.png, screenshot_sha256: REPLACE_WITH_SHA256, screenshot_bytes: 0, screenshot_dimensions: {width: 0, height: 0}, captured_consumer_head: REPLACE_WITH_FINAL_MIGRATION_SHA, console_status: clean, network_status: clean, sample_fallback: false}
  - {profile: mobile, route_ref: "route:sha256:REPLACE", center_ref: "center:sha256:REPLACE", viewport: 390x844, browser: webkit, screenshot_ref: qa/mobile.png, screenshot_sha256: REPLACE_WITH_SHA256, screenshot_bytes: 0, screenshot_dimensions: {width: 0, height: 0}, captured_consumer_head: REPLACE_WITH_FINAL_MIGRATION_SHA, console_status: clean, network_status: clean, sample_fallback: false}
  - {profile: fallback, route_ref: "route:sha256:REPLACE", center_ref: "center:sha256:REPLACE", viewport: 1440x1000, browser: chromium, screenshot_ref: qa/fallback.png, screenshot_sha256: REPLACE_WITH_SHA256, screenshot_bytes: 0, screenshot_dimensions: {width: 0, height: 0}, captured_consumer_head: REPLACE_WITH_FINAL_MIGRATION_SHA, console_status: clean, network_status: clean, sample_fallback: false}
  - {profile: quadrant_collection_two_step, route_ref: "route:sha256:REPLACE", center_ref: "center:sha256:REPLACE", viewport: 1440x1000, browser: chromium, screenshot_ref: qa/quadrant-collection-two-step.png, screenshot_sha256: REPLACE_WITH_SHA256, screenshot_bytes: 0, screenshot_dimensions: {width: 0, height: 0}, captured_consumer_head: REPLACE_WITH_FINAL_MIGRATION_SHA, console_status: clean, network_status: clean, sample_fallback: false}
rollback:
  previous_sha: REPLACE_WITH_PREVIOUS_CONSUMER_SHA
  import_commit_sha: REPLACE_WITH_IMPORT_COMMIT_SHA
  command: git revert --no-commit <adaptation> <artifacts> <import>
  preserves_local_paths:
    - wiki.config.yaml
    - wiki.targets.yaml
    - memories/
