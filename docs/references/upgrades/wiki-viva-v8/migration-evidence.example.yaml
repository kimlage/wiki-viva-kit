# HISTORICAL REFERENCE ONLY: this is the manual v2 migration-evidence template.
# It is not evidence for the current v3 package or for any current release, and
# a v2 adoption already in progress must preserve its original package/runbook.
# Copy it only when reconstructing that historical manual v2 workflow, then
# replace every placeholder with evidence from that repository. The public
# template intentionally contains no real private paths, SHAs, routes or
# screenshots.
#
# New v3 adoptions MUST NOT hand-author or copy this file. Their evidence is
# generated and verified fail-closed by the byte-equal runner invoked through:
#   python3 scripts/wiki_upgrade.py adopt --plan <PLAN_JSON> --mode canary
# Use --resume with the original anchors for an interrupted, unfinished run.
#
# v5 contract: all three commit boundaries are package-declared and mandatory;
# consumer_before binds both configured roots to the authoritative preflight
# sidecar. Gate commands must match the package's migration.gate_commands
# registry verbatim, and a checked report additionally requires
# gates_receipt_ref (an ignored, untracked JSON receipt of the executed runs).
schema_version: wiki_viva_migration_evidence.v2
evidence_context:
  package_sha256: REPLACE_WITH_PACKAGE_SHA256
  validator_version: wiki_viva_upgrade_validator.v5
  captured_consumer_head: REPLACE_WITH_ADAPTATION_COMMIT_SHA
source:
  release: HISTORICAL_V2_RELEASE_ID
  sha: REPLACE_WITH_HISTORICAL_V2_PINNED_PUBLIC_SHA
  plan: docs/references/proposals/HISTORICAL_V2_PLAN.md
consumer_before:
  repository: consumer-id
  branch: wiki/upgrade-v8
  head_sha: REPLACE_WITH_PREVIOUS_CONSUMER_SHA
  kit_version: untracked
  gate_status: pass
  memory_root: REPLACE_WITH_CONSUMER_MEMORY_ROOT
  references_root: REPLACE_WITH_CONSUMER_REFERENCES_ROOT
  preflight:
    status: ready
    report_id: REPLACE_WITH_PREFLIGHT_REPORT_ID
    report_sha256: REPLACE_WITH_PREFLIGHT_REPORT_SHA256
    report_ref: output/wiki-upgrade/preflight-report.json
    package_sha256: REPLACE_WITH_PACKAGE_SHA256
    consumer_head: REPLACE_WITH_PREVIOUS_CONSUMER_SHA
consumer_after:
  branch: wiki/upgrade-v8
  import_commit_sha: REPLACE_WITH_IMPORT_COMMIT_SHA
  artifact_commit_sha: REPLACE_WITH_ARTIFACT_COMMIT_SHA
  adaptation_commit_sha: REPLACE_WITH_ADAPTATION_COMMIT_SHA
# v5 packages declare all three boundaries; none may be omitted.
omitted_boundaries: []
files_imported:
  - wiki_core/upgrade.py
  - scripts/_git_subject.py
  - packs/personal-finance/pack.yaml
  - docs/references/schemas/wiki-migration-evidence-v2.schema.json
  - docs/references/schemas/wiki-temporal-graph-v1.schema.json
# Every path below must match one migration.generated_artifact_patterns glob
# and byte-match the pinned public tree at artifact_commit_sha.
generated_artifacts:
  - apps/wiki-cockpit/public/sample-snapshot/manifest.json
  - docs/references/fixtures/demo-wiki/memories/index.md
# Consumer-owned surfaces only (wiki.config.yaml, targets, local templates,
# tests/**, workflows, paths under the consumer memory root, or a release record
# below <references_root>/releases/**). The release record is authored in the
# third commit; sibling reference paths are not adaptation surfaces.
downstream_adaptations:
  - docs/references/releases/HISTORICAL_V2_RELEASE_RECORD.md
  - wiki.config.yaml
local_overrides_kept:
  - wiki.config.yaml
  - wiki.targets.yaml
  - wiki.page-types.yaml
  - wiki.templates.yaml
  - requirements.txt
  - tests/
  - wiki.packs.lock.yaml
  - wiki.adapter-manifest.json
  - wiki.page-types.local.yaml
  - wiki.templates.local.yaml
  - .github/workflows/wiki.yml
  - apps/wiki-cockpit/public/wiki-cockpit.config.json
warnings: []
fixtures_added: []
# Ignored, untracked JSON receipt of the executed gate runs. Each entry records
# {id, command, exit_code, output_sha256} and the file pins the final boundary
# SHA as captured_consumer_head. Required whenever the report runs --check.
gates_receipt_ref: output/wiki-upgrade/gate-receipts.json
# Commands below are the package's migration.gate_commands registry verbatim.
# $WIKI_VIVA_KIT_ROOT is the consumer's local kit checkout (drift reference).
gates:
  - {id: toolkit_drift, command: 'python3 scripts/wiki_toolkit_drift.py --ref-path "$WIKI_VIVA_KIT_ROOT" --check', status: pass, exit_code: 0, captured_consumer_head: REPLACE_WITH_ADAPTATION_COMMIT_SHA}
  - {id: audit, command: "python3 scripts/wiki_audit.py --check", status: pass, exit_code: 0, captured_consumer_head: REPLACE_WITH_ADAPTATION_COMMIT_SHA}
  - {id: public_evidence_redaction, command: "python3 scripts/wiki_audit.py --public-export --check", status: pass, exit_code: 0, captured_consumer_head: REPLACE_WITH_ADAPTATION_COMMIT_SHA}
  - {id: methodology_coverage, command: "python3 scripts/wiki_check_methodology_coverage.py --check", status: pass, exit_code: 0, captured_consumer_head: REPLACE_WITH_ADAPTATION_COMMIT_SHA}
  - {id: quality_report, command: "python3 scripts/wiki_quality_report.py --check", status: pass, exit_code: 0, captured_consumer_head: REPLACE_WITH_ADAPTATION_COMMIT_SHA}
  - {id: operation_compile, command: "python3 scripts/wiki_operation_compile.py --check", status: pass, exit_code: 0, captured_consumer_head: REPLACE_WITH_ADAPTATION_COMMIT_SHA}
  - {id: source_registry, command: "python3 scripts/wiki_source_registry.py --check", status: pass, exit_code: 0, captured_consumer_head: REPLACE_WITH_ADAPTATION_COMMIT_SHA}
  - {id: input_stage, command: "python3 scripts/wiki_input_stage.py --check", status: pass, exit_code: 0, captured_consumer_head: REPLACE_WITH_ADAPTATION_COMMIT_SHA}
  - {id: semantic_inventory, command: "python3 scripts/wiki_semantic_inventory.py --check", status: pass, exit_code: 0, captured_consumer_head: REPLACE_WITH_ADAPTATION_COMMIT_SHA}
  - {id: pytest, command: "python3 -m pytest tests/", status: pass, exit_code: 0, captured_consumer_head: REPLACE_WITH_ADAPTATION_COMMIT_SHA}
  - {id: frontend, command: "npm --prefix apps/wiki-cockpit test", status: pass, exit_code: 0, captured_consumer_head: REPLACE_WITH_ADAPTATION_COMMIT_SHA}
  - {id: build, command: "npm --prefix apps/wiki-cockpit run build", status: pass, exit_code: 0, captured_consumer_head: REPLACE_WITH_ADAPTATION_COMMIT_SHA}
  - {id: node_gates, command: "npm --prefix apps/wiki-cockpit run test:gates", status: pass, exit_code: 0, captured_consumer_head: REPLACE_WITH_ADAPTATION_COMMIT_SHA}
  - {id: snapshot_contract, command: "python3 scripts/wiki_web_snapshot.py --check-contract", status: pass, exit_code: 0, captured_consumer_head: REPLACE_WITH_ADAPTATION_COMMIT_SHA}
  - {id: pack_validation, command: "python3 scripts/wiki_pack.py validate --all", status: pass, exit_code: 0, captured_consumer_head: REPLACE_WITH_ADAPTATION_COMMIT_SHA}
  - {id: architecture, command: "npm --prefix apps/wiki-cockpit run check:architecture", status: pass, exit_code: 0, captured_consumer_head: REPLACE_WITH_ADAPTATION_COMMIT_SHA}
  - {id: assets, command: "npm --prefix apps/wiki-cockpit run check:assets", status: pass, exit_code: 0, captured_consumer_head: REPLACE_WITH_ADAPTATION_COMMIT_SHA}
  - {id: bundle, command: "npm --prefix apps/wiki-cockpit run check:bundle", status: pass, exit_code: 0, captured_consumer_head: REPLACE_WITH_ADAPTATION_COMMIT_SHA}
  - {id: release_matrix_inventory, command: "npm --prefix apps/wiki-cockpit run check:release-matrix", status: pass, exit_code: 0, captured_consumer_head: REPLACE_WITH_ADAPTATION_COMMIT_SHA}
  - {id: browser_required, command: "npm --prefix apps/wiki-cockpit run test:e2e:release", status: pass, exit_code: 0, captured_consumer_head: REPLACE_WITH_ADAPTATION_COMMIT_SHA}
  - {id: demo_drift, command: "python3 scripts/wiki_build_demo.py --check", status: pass, exit_code: 0, captured_consumer_head: REPLACE_WITH_ADAPTATION_COMMIT_SHA}
  - {id: diff_check, command: "git diff --check", status: pass, exit_code: 0, captured_consumer_head: REPLACE_WITH_ADAPTATION_COMMIT_SHA}
visual_qa_evidence:
  - {profile: desktop, route_ref: "route:sha256:REPLACE", center_ref: "center:sha256:REPLACE", viewport: 1440x1000, browser: chromium, screenshot_ref: output/wiki-upgrade/qa/desktop.png, screenshot_sha256: REPLACE_WITH_SHA256, screenshot_bytes: 1, screenshot_dimensions: {width: 1440, height: 1000}, captured_consumer_head: REPLACE_WITH_ADAPTATION_COMMIT_SHA, console_status: clean, network_status: clean, sample_fallback: false}
  - {profile: mobile, route_ref: "route:sha256:REPLACE", center_ref: "center:sha256:REPLACE", viewport: 390x844, browser: webkit, screenshot_ref: output/wiki-upgrade/qa/mobile.png, screenshot_sha256: REPLACE_WITH_SHA256, screenshot_bytes: 1, screenshot_dimensions: {width: 390, height: 844}, captured_consumer_head: REPLACE_WITH_ADAPTATION_COMMIT_SHA, console_status: clean, network_status: clean, sample_fallback: false}
  - {profile: fallback, route_ref: "route:sha256:REPLACE", center_ref: "center:sha256:REPLACE", viewport: 390x844, browser: chromium, screenshot_ref: output/wiki-upgrade/qa/fallback.png, screenshot_sha256: REPLACE_WITH_SHA256, screenshot_bytes: 1, screenshot_dimensions: {width: 390, height: 844}, captured_consumer_head: REPLACE_WITH_ADAPTATION_COMMIT_SHA, console_status: clean, network_status: clean, sample_fallback: false}
  - {profile: quadrant_collection_two_step, route_ref: "route:sha256:REPLACE", center_ref: "center:sha256:REPLACE", viewport: 1440x1000, browser: chromium, screenshot_ref: output/wiki-upgrade/qa/quadrant-collection-two-step.png, screenshot_sha256: REPLACE_WITH_SHA256, screenshot_bytes: 1, screenshot_dimensions: {width: 1440, height: 1000}, captured_consumer_head: REPLACE_WITH_ADAPTATION_COMMIT_SHA, console_status: clean, network_status: clean, sample_fallback: false}
rollback:
  previous_sha: REPLACE_WITH_PREVIOUS_CONSUMER_SHA
  import_commit_sha: REPLACE_WITH_IMPORT_COMMIT_SHA
  command: git revert --no-commit REPLACE_WITH_ADAPTATION_COMMIT_SHA REPLACE_WITH_ARTIFACT_COMMIT_SHA REPLACE_WITH_IMPORT_COMMIT_SHA
  preserves_local_paths:
    - wiki.config.yaml
    - wiki.targets.yaml
    - REPLACE_WITH_CONSUMER_MEMORY_ROOT
